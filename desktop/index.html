<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNODLAA</title>
<link rel="icon" href="assets/logo.png">
<style>
  :root{
    --fuchsia:#E81E8C; --turq:#009B8E; --yellow:#FFC531; --orange:#F57C00; --cobalt:#2B6BFF;
    --bg:#FFF9FC; --bg2:#FBEAF3; --card:#fff; --ink:#1B1B1F; --muted:#7A6B75; --border:#EBD5E4;
    --gold:#E3B341; --ok:#0A9A5B; --warn:#F57C00; --bad:#D32F4B;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  button,select,input,textarea{font:inherit}
  button{cursor:pointer;border:none;border-radius:10px;padding:8px 14px;background:var(--bg2);color:var(--ink)}
  button:hover:not(:disabled){filter:brightness(1.04)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:linear-gradient(90deg,var(--fuchsia),var(--orange));color:#fff;font-weight:700}
  button.go{background:linear-gradient(90deg,var(--turq),var(--cobalt));color:#fff;font-weight:800}
  button.big{font-size:16px;padding:12px 22px;border-radius:14px}
  button.small{padding:5px 10px;font-size:12px}
  input[type=text],textarea,select{background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:8px}
  .hidden{display:none!important}
  .muted{color:var(--muted)} .small-t{font-size:12px}

  header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  header img{height:38px;width:38px;border-radius:50%}
  .brand{display:flex;flex-direction:column;line-height:1.1}
  .brand b{font-size:16px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--fuchsia),var(--orange),var(--turq),var(--cobalt));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand span{font-size:11px;color:var(--muted)}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
  .chip.ok{background:#E3F6EE;color:var(--ok)} .chip.pro{background:linear-gradient(90deg,#FFE9A8,#FFD0E6);color:#7A4A00;font-weight:700} .chip.bad{background:#FDE3E8;color:var(--bad)}
  .spacer{flex:1}

  /* ---------- setup wizard ---------- */
  #setup{max-width:860px;margin:28px auto;padding:0 16px 60px}
  #setup h1{margin:0 0 4px;font-size:24px}
  .step{display:flex;gap:16px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:16px;transition:opacity .2s}
  .step.locked{opacity:.45;pointer-events:none}
  .step.current{border:2px solid var(--fuchsia);box-shadow:0 8px 28px rgba(232,30,140,.12)}
  .step .num{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--fuchsia),var(--orange))}
  .step.done .num{background:var(--ok)}
  .step .body{flex:1;min-width:0}
  .step h3{margin:6px 0 4px;font-size:17px}
  .step p{margin:4px 0 12px;color:var(--muted)}
  .status{margin-top:10px;font-size:13px;min-height:18px}
  .status.ok{color:var(--ok);font-weight:600} .status.bad{color:var(--bad)}
  .pathbox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg2);font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
  details{margin-top:12px} summary{cursor:pointer;color:var(--muted);font-size:13px}
  .helpsteps{margin:8px 0 0 18px;padding:0} .helpsteps li{margin:4px 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .row input[type=text]{flex:1;min-width:220px}
  .presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
  .preset{border:2px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;background:#fff}
  .preset.sel{border-color:var(--fuchsia);background:#FFF3F9}
  .preset b{display:block;margin-bottom:6px}
  .preset code{font-size:12px;color:var(--muted);word-break:break-all}
  .formats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .formats label{border:2px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;flex:1;min-width:220px;background:#fff}
  .formats label.sel{border-color:var(--turq);background:#EFFCFA}
  .preview{margin-top:14px;padding:12px;border-radius:12px;background:#1B1B1F;color:#fff;font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
  .preview .dim{color:#A99BA5}
  .finish{text-align:center;margin-top:24px}

  /* ---------- library ---------- */
  #library{display:flex;flex-direction:column;height:calc(100vh - 55px)}
  .banner{margin:10px 16px 0;padding:10px 14px;border-radius:12px;background:#FFF4E0;color:#7A4A00;border:1px solid #FFD699}
  .hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:12px 16px 0;padding:16px 18px;border-radius:18px;background:#fff;border:1px solid var(--border)}
  .stats{display:flex;gap:18px;flex-wrap:wrap;flex:1}
  .stat b{display:block;font-size:22px} .stat span{font-size:12px;color:var(--muted)}
  .stat.miss b{color:var(--orange)} .stat.have b{color:var(--ok)}
  .analyzing{flex-basis:100%;font-size:12px;color:var(--muted)}
  .bar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fuchsia),var(--orange));transition:width .3s}
  .cols{flex:1;display:grid;grid-template-columns:290px 1fr 320px;min-height:0;margin-top:12px;border-top:1px solid var(--border)}
  .col{overflow:auto;padding:10px}
  .col.ws{border-right:1px solid var(--border)} .col.job{border-left:1px solid var(--border);background:#fff}
  .ptitle{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 4px 8px;font-weight:700}
  .ws-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}
  .ws-item:hover{background:var(--bg2)} .ws-item.active{background:var(--bg2);outline:2px solid var(--fuchsia)}
  .ws-item img,.ws-item .ph{width:42px;height:42px;border-radius:10px;object-fit:cover;background:linear-gradient(135deg,var(--fuchsia),var(--turq));flex:none}
  .ws-item .meta{min-width:0;flex:1} .ws-item .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
  .badge.full{background:#E3F6EE;color:var(--ok)} .badge.part{background:#FFF1DE;color:var(--orange)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .toolbar input{flex:1;min-width:140px}
  .clip{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:12px}
  .clip:hover{background:var(--bg2)}
  .clip.orig{background:linear-gradient(90deg,rgba(255,197,49,.28),transparent);outline:1px solid var(--gold)}
  .clip img,.clip .ph{width:40px;height:40px;border-radius:8px;object-fit:cover;background:linear-gradient(135deg,var(--orange),var(--fuchsia));flex:none}
  .clip .t{min-width:0;flex:1} .clip .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .clip .title .star{color:var(--gold)} .clip .tags{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clip input{width:18px;height:18px;accent-color:var(--fuchsia)}
  .avail{width:22px;text-align:center;flex:none}
  .empty{color:var(--muted);text-align:center;padding:36px 10px}
  .jobbox{border-radius:14px;padding:12px;background:var(--bg2)}
  .jobbox .now{font-weight:700;margin:6px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .counts{display:flex;gap:12px;font-size:12px;margin-top:8px;flex-wrap:wrap}
  .counts .c-ok{color:var(--ok)} .counts .c-bad{color:var(--bad)} .counts .c-skip{color:var(--muted)}
  .fail{font-size:12px;padding:6px 8px;border-radius:8px;background:#FDE3E8;margin-top:6px}
  .fail b{display:block}
  .player{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:8px 16px;display:none;align-items:center;gap:12px;z-index:30}
  .player.show{display:flex} .player .pt{flex:1;min-width:0} .player .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .karaoke{position:fixed;inset:0;background:rgba(255,249,252,.97);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
  .karaoke.show{display:flex} .karaoke .line{font-size:26px;line-height:1.7;max-width:800px;color:var(--muted)}
  .karaoke .w.on{color:var(--fuchsia);font-weight:700} .karaoke .close{position:absolute;top:16px;right:20px}
  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;display:none;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  @media (max-width:1000px){ .cols{grid-template-columns:1fr} .col.ws,.col.job{border:none} }
</style>
</head>
<body>
<header>
  <img src="assets/logo.png" alt="">
  <div class="brand"><b>SUNODLAA</b><span>SunoAAWeb</span></div>
  <span id="acctChip" class="chip hidden"></span>
  <span class="spacer"></span>
  <button class="small hidden" id="btnLibrary" onclick="openLibrary()"></button>
  <button class="small" id="btnSetup" onclick="showSetup()"></button>
</header>

<!-- ======================= SETUP / WIZARD ======================= -->
<section id="setup" class="hidden">
  <div class="row" style="justify-content:space-between;margin-top:0">
    <div>
      <h1 id="sTitle"></h1>
      <div class="muted" id="sIntro"></div>
    </div>
    <label class="small-t muted"><span id="sLangLbl"></span>
      <select id="langSel" onchange="setLang(this.value)"><option value="en">English</option><option value="fr">Français</option></select>
    </label>
  </div>

  <div class="step" id="step1">
    <div class="num">1</div>
    <div class="body">
      <h3 id="s1Title"></h3>
      <p id="s1Text"></p>
      <button class="primary big" id="btnConnect" onclick="doLogin()"></button>
      <div class="status" id="s1Status"></div>
      <details id="s1Help">
        <summary id="s1HelpSum"></summary>
        <ol class="helpsteps" id="s1HelpSteps"></ol>
        <div class="row"><input type="text" id="cookieInput" placeholder="__client = …"><button id="btnCookie" onclick="saveCookie()"></button></div>
      </details>
    </div>
  </div>

  <div class="step" id="step2">
    <div class="num">2</div>
    <div class="body">
      <h3 id="s2Title"></h3>
      <p id="s2Text"></p>
      <button class="primary big" id="btnPick" onclick="pickFolder()"></button>
      <div class="pathbox hidden" id="libPath"></div>
      <div class="status" id="s2Status"></div>
      <details id="s2Type">
        <summary id="s2TypeSum"></summary>
        <div class="row"><input type="text" id="libInput" placeholder="P:\Music"><button id="btnLibOk" onclick="saveLibPath()">OK</button></div>
      </details>
    </div>
  </div>

  <div class="step" id="step3">
    <div class="num">3</div>
    <div class="body">
      <h3 id="s3Title"></h3>
      <p id="s3Text"></p>
      <div class="presets" id="presets"></div>
      <div id="customBox" class="hidden">
        <div class="row"><span class="small-t muted" style="width:120px" id="lblFolderPat"></span><input type="text" id="folderPat" oninput="customChanged()"></div>
        <div class="row"><span class="small-t muted" style="width:120px" id="lblFilePat"></span><input type="text" id="filePat" oninput="customChanged()"></div>
        <div class="small-t muted" style="margin-top:6px" id="tokensHelp"></div>
      </div>
      <div style="margin-top:14px;font-weight:700" id="lblQuality"></div>
      <div class="formats" id="formats"></div>
      <label class="small-t" style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;cursor:pointer"><input type="checkbox" id="lrcBox" style="margin-top:2px" onchange="saveOpts({saveLrc:this.checked})"><span id="lblLrc" style="flex:1"></span></label>
      <div class="preview" id="preview"></div>
    </div>
  </div>

  <details id="advanced" style="margin-top:18px">
    <summary id="advSum"></summary>
    <div class="step" style="margin-top:10px"><div class="body">
      <div class="row"><span id="lblDelay"></span><input type="text" id="delayInput" style="max-width:70px" onchange="saveOpts({downloadDelaySec:+this.value||0})"><span class="muted small-t" id="lblDelayHint"></span></div>
      <div class="row"><button id="btnRenameFolders" onclick="applyFolders()"></button><span class="muted small-t" id="lblRenameHint"></span></div>
    </div></div>
  </details>

  <div class="finish"><button class="go big" id="btnFinish" onclick="openLibrary()"></button></div>
</section>

<!-- ======================= LIBRARY ======================= -->
<section id="library" class="hidden">
  <div class="banner hidden" id="freeBanner"></div>
  <div class="hero">
    <div class="stats">
      <div class="stat"><b id="nTracks">–</b><span id="lTracks"></span></div>
      <div class="stat"><b id="nWs">–</b><span id="lWs"></span></div>
      <div class="stat have"><b id="nHave">–</b><span id="lHave"></span></div>
      <div class="stat miss"><b id="nMiss">–</b><span id="lMiss"></span></div>
    </div>
    <button class="go big" id="btnEverything" onclick="downloadEverything()"></button>
    <button class="small" id="btnRecheck" onclick="analyze(true)"></button>
    <div class="analyzing hidden" id="analyzing"><span id="anText"></span><div class="bar"><i id="anBar"></i></div></div>
  </div>
  <div class="cols">
    <div class="col ws"><div class="ptitle" id="tWs"></div><div id="wsList"></div></div>
    <div class="col">
      <div class="toolbar">
        <input type="text" id="search" oninput="renderClips()">
        <button class="small" id="btnWsMissing" onclick="downloadWorkspaceMissing()"></button>
        <button class="small" id="btnSelected" onclick="downloadSelected()"></button>
      </div>
      <div id="clipList"></div>
    </div>
    <div class="col job">
      <div class="ptitle" id="tJob"></div>
      <div id="jobIdle" class="empty"></div>
      <div id="jobBox" class="jobbox hidden">
        <div class="small-t muted" id="jobStep"></div>
        <div class="now" id="jobNow"></div>
        <div class="bar"><i id="jobBar"></i></div>
        <div class="counts"><span class="c-ok" id="cOk"></span><span class="c-bad" id="cBad"></span><span class="c-skip" id="cSkip"></span></div>
        <div class="row"><button class="small" id="btnStop" onclick="stopJob()"></button></div>
      </div>
      <div id="failList"></div>
    </div>
  </div>
</section>

<div class="player" id="player">
  <div class="pt"><div class="n" id="pName">—</div><div class="muted small-t" id="pSub"></div></div>
  <button class="small" onclick="openKaraoke()">🎤 <span id="lblLyrics"></span></button>
  <audio id="audio" controls></audio>
</div>
<div class="karaoke" id="karaoke"><button class="close" onclick="closeKaraoke()">✕</button><div class="line" id="karaokeLine">…</div></div>
<div class="toast" id="toast"></div>

/* ============================== boot ============================== */
(async function(){
  applyLang();

async function loadAccount(){ ACC=await api('/api/account').catch(()=>null); renderAccount(); renderSetup(); }
function renderAccount(){

  if(!AUTH.ok){ c.className='chip bad'; c.textContent=t.notConnected; $('#freeBanner').classList.add('hidden'); return; }
  const parts=[ACC&&ACC.label?ACC.label:t.connectedChip];
  if(ACC&&ACC.ok){ parts.push(ACC.pro?'Pro ★':'Free'); if(ACC.credits!=null) parts.push(t.credits(ACC.credits)); }
  c.textContent=parts.join(' · '); c.className='chip '+(ACC&&ACC.pro?'pro':'ok');
  $('#freeBanner').classList.toggle('hidden', !(ACC&&ACC.ok&&!ACC.pro));
}

/* ============================== setup / wizard ============================== */
function showSetup(){ $('#setup').classList.remove('hidden'); $('#library').classList.add('hidden'); $('#btnSetup').classList.add('hidden'); $('#btnLibrary').classList.toggle('hidden',!(AUTH.ok&&CFG.libraryExists)); renderSetup(); }
function presetOf(){
  if(CFG.folderPattern===PRESETS.mm.folder && (CFG.fileNamePattern===PRESETS.mm.file||CFG.fileNamePattern===MM_FR)) return 'mm';
  if(CFG.folderPattern===PRESETS.simple.folder && CFG.fileNamePattern===PRESETS.simple.file) return 'simple';
  return 'custom';
}
function renderSetup(){
  const t=T(); if(!CFG || !$('#step1')) return;
  const s1=!!AUTH.ok, s2=!!CFG.libraryExists;
  const cls=(el,done,current,locked)=>{ el.classList.toggle('done',done); el.classList.toggle('current',current); el.classList.toggle('locked',locked); };
  cls($('#step1'),s1,!s1,false); cls($('#step2'),s2,s1&&!s2,!s1); cls($('#step3'),false,s1&&s2,!(s1&&s2));
  $('#step1 .num').textContent=s1?'✓':'1'; $('#step2 .num').textContent=s2?'✓':'2';
  $('#btnConnect').textContent=s1?t.reconnect:t.connect;
  if(s1 && !$('#s1Status').dataset.live){ $('#s1Status').className='status ok'; $('#s1Status').textContent=t.connectedAs(ACC&&ACC.label); }
  $('#btnPick').textContent=s2?t.pickOther:t.pick;
  $('#libPath').classList.toggle('hidden',!s2); $('#libPath').textContent=CFG.libraryPath||'';
  const cur=customMode?'custom':presetOf();
  const mmFile=LANG==='fr'?MM_FR:PRESETS.mm.file;
  const P=[['mm',t.presetMM,t.presetMMd,PRESETS.mm.folder+'\\'+mmFile],['simple',t.presetSimple,t.presetSimpled,PRESETS.simple.folder+'\\'+PRESETS.simple.file],['custom',t.presetCustom,t.presetCustomd,'']];
  $('#presets').innerHTML=P.map(([k,n,d,c])=>`<div class="preset ${cur===k?'sel':''}" onclick="choosePreset('${k}')"><b>${esc(n)}</b><div class="small-t muted">${esc(d)}</div>${c?`<code>${esc(c)}</code>`:''}</div>`).join('');
  $('#customBox').classList.toggle('hidden',cur!=='custom');
  if(document.activeElement!==$('#folderPat')) $('#folderPat').value=CFG.folderPattern||'';
  if(document.activeElement!==$('#filePat')) $('#filePat').value=CFG.fileNamePattern||'';
  const fmt=CFG.audioFormat||'mp3';
  $('#formats').innerHTML=[['mp3',t.mp3,t.mp3d],['wav',t.wav,t.wavd]].map(([k,n,d])=>`<label class="${fmt===k?'sel':''}"><input type="radio" name="fmt" ${fmt===k?'checked':''} onchange="saveOpts({audioFormat:'${k}'})"> <b>${esc(n)}</b><div class="small-t muted">${esc(d)}</div></label>`).join('');
  $('#lrcBox').checked=CFG.saveLrc!==false;
  if(document.activeElement!==$('#delayInput')) $('#delayInput').value=CFG.downloadDelaySec??3;
  const lib=(CFG.libraryPath||'…').replace(/[\\/]+$/,''), fe=CFG.fileExample||'', fo=CFG.folderExample||'';
  $('#preview').innerHTML=`<span class="dim">${esc(t.preview)} :</span><br>${esc(lib)}\\${esc(fo)}\\<b>${esc(fe)}</b>`+(CFG.saveLrc!==false?`<br><span class="dim">${esc(lib)}\\${esc(fo)}\\${esc(fe.replace(/\.[^.]+$/,'.lrc'))}</span>`:'');
  const ready=s1&&s2; $('#btnFinish').disabled=!ready; $('#btnFinish').textContent=ready?t.finish:t.finishNeed;
}
async function saveOpts(o){ CFG=await post('/api/config',o); renderSetup(); }
function choosePreset(k){
  customMode=(k==='custom');
  if(k==='mm') saveOpts({folderPattern:PRESETS.mm.folder,fileNamePattern:LANG==='fr'?MM_FR:PRESETS.mm.file});
  else if(k==='simple') saveOpts(PRESETS.simple.folder?{folderPattern:PRESETS.simple.folder,fileNamePattern:PRESETS.simple.file}:{});
  else renderSetup();
}
let customT=null;
function customChanged(){ clearTimeout(customT); customT=setTimeout(()=>saveOpts({folderPattern:$('#folderPat').value.trim()||'{workspace}',fileNamePattern:$('#filePat').value.trim()||'<Title>'}),400); }

let loginPoll=null;
async function doLogin(){
  const t=T(), st=$('#s1Status'); st.dataset.live='1'; st.className='status'; st.textContent=t.opening;
  const r=await post('/api/login/start').catch(()=>({ok:false}));
  if(!r.ok){ st.className='status bad'; st.textContent=t.noBrowser; $('#s1Help').open=true; return; }
  st.textContent=t.waiting;
  clearInterval(loginPoll); let n=0;
  const tick=async()=>{
    n++; const T2=T();
    if(n>120){ clearInterval(loginPoll); st.className='status bad'; st.textContent=T2.timedOut; $('#s1Help').open=true; return; }
    const c=await api('/api/login/check').catch(()=>({}));
    if(c.ok){ clearInterval(loginPoll); await afterAuth(); return; }
    if(c.code==='window_closed'){ clearInterval(loginPoll); st.className='status bad'; st.textContent=T2.windowClosed; return; }
    if(c.code==='session_invalid'){ st.className='status bad'; st.textContent=T2.sessionInvalid+(c.detail?'  ['+c.detail+']':''); return; }
    st.className='status'; st.textContent=T2.notSignedIn;
  };
  setTimeout(tick,1500); loginPoll=setInterval(tick,2500);
}
async function saveCookie(){
  const v=$('#cookieInput').value.trim().replace(/^__client=/,''); if(!v) return;
  await post('/api/config',{clientCookie:v}); AUTH=await api('/api/auth');
  if(AUTH.ok){ $('#cookieInput').value=''; await afterAuth(); } else { $('#s1Status').className='status bad'; $('#s1Status').textContent=T().cookieBad; }
}
async function afterAuth(){ AUTH=await api('/api/auth'); delete $('#s1Status').dataset.live; CFG=await api('/api/config'); await loadAccount(); renderSetup(); renderAccount(); }
async function pickFolder(){
  const st=$('#s2Status'); st.textContent='…'; st.className='status';
  const r=await post('/api/folder/pick').catch(()=>({ok:false,error:'x'}));
  if(r.ok){ CFG=await api('/api/config'); st.textContent=''; workspaces=[]; clipsByWs={}; analyzed=false; }
  else if(r.cancelled){ st.textContent=''; }
  else { st.className='status bad'; st.textContent=T().pickFailed; $('#s2Type').open=true; }
  renderSetup();
}
async function saveLibPath(){
  const v=$('#libInput').value.trim().replace(/^"|"$/g,''); if(!v) return;
  CFG=await post('/api/config',{libraryPath:v}); workspaces=[]; clipsByWs={}; analyzed=false;
  const st=$('#s2Status'); if(!CFG.libraryExists){ st.className='status bad'; st.textContent=T().folderMissing; } else st.textContent='';
  renderSetup();
}
async function applyFolders(){
  const t=T(), d=await api('/api/folders/preview'), plan=d.plan||[];
  const ren=plan.filter(p=>p.status==='rename'), conf=plan.filter(p=>p.status==='conflict');
  if(!ren.length){ toast(t.foldersNone); return; }
  const ex=ren.slice(0,8).map(p=>`${p.from}  →  ${p.to}`).join('\n')+(ren.length>8?`\n… (+${ren.length-8})`:'');
  if(!confirm(t.foldersConfirm(ren.length,ex,conf.length))) return;
  const r=await post('/api/folders/apply'); localIds={}; analyzed=false;
  toast(t.foldersDone(r.renamed||0,r.skipped||0,(r.errors||[]).length),6000);
}

/* ============================== library ============================== */
function openLibrary(){
  if(!(AUTH.ok&&CFG.libraryExists)){ showSetup(); return; }
  $('#setup').classList.add('hidden'); $('#library').classList.remove('hidden');
  $('#btnSetup').classList.remove('hidden'); $('#btnLibrary').classList.add('hidden');
  if(!workspaces.length) loadLibrary(); else if(!analyzed) analyze(); else renderAll();
}
function renderAll(){ renderStats(); renderWorkspaces(); renderClips(); renderJob(); }
async function loadLibrary(){
  workspaces=[]; let page=1,total=null;
  $('#wsList').innerHTML='<div class="empty">…</div>';
  while(true){
    const d=await api('/api/suno?path=/api/project/me&page='+page).catch(e=>({error:''+e}));
    if(d.error){ $('#wsList').innerHTML='<div class="empty">'+esc(d.error)+'</div>'; return; }
    const items=d.projects||[]; workspaces=workspaces.concat(items); total=d.num_total_results??total;
    if(!items.length||(total!=null&&workspaces.length>=total)) break; page++;
  }
  renderWorkspaces(); analyze();
}
async function fetchClips(ws){
  const out=[]; let page=1;
  while(true){
    const d=await api('/api/suno?path=/api/project/'+ws.id+'&page='+page);
    if(d.error) throw new Error(d.error);
    const pc=d.project_clips||[]; pc.forEach(x=>{ if(x.clip) out.push(x.clip); });
    if(pc.length<20) break; page++;
  }
  return out;
}
async function scanLocal(){ const r=await api('/api/scan'); localIds={}; if(r.ids) Object.keys(r.ids).forEach(id=>localIds[id]=true); }
async function analyze(refetch){
  if(analyzing) return; analyzing=true; analyzed=false; if(refetch) clipsByWs={};
  const box=$('#analyzing'); box.classList.remove('hidden'); renderStats();
  await scanLocal();
  for(let i=0;i<workspaces.length;i++){
    $('#anText').textContent=T().analyzing(i,workspaces.length); $('#anBar').style.width=(100*i/Math.max(1,workspaces.length))+'%';
    const w=workspaces[i];
    if(!clipsByWs[w.id]){ try{ clipsByWs[w.id]=await fetchClips(w); }catch(e){ clipsByWs[w.id]=[]; } }
    if(i%5===0){ renderStats(); renderWorkspaces(); }
  }
  analyzing=false; analyzed=true; box.classList.add('hidden'); renderAll();
}
function wsStats(w){ const cs=clipsByWs[w.id]; if(!cs) return null; const have=cs.filter(c=>localIds[c.id]).length; return {total:cs.length,have,miss:cs.length-have}; }
function renderStats(){
  const t=T(); if(!$('#nTracks')) return; let tot=0,have=0,known=0;
  workspaces.forEach(w=>{ const s=wsStats(w); if(s){ tot+=s.total; have+=s.have; known++; } });
  $('#nTracks').textContent=known?tot:'–'; $('#nWs').textContent=workspaces.length||'–';
  $('#nHave').textContent=known?have:'–'; $('#nMiss').textContent=known?(tot-have):'–';
  const b=$('#btnEverything'); b.textContent=analyzed?t.everything(tot-have):t.notAnalyzed; b.disabled=!analyzed||(tot-have)===0||!!(job&&job.running);
}
function renderWorkspaces(){
  const el=$('#wsList'); if(!el) return;
  if(!workspaces.length){ el.innerHTML='<div class="empty">…</div>'; return; }
  el.innerHTML='';
  workspaces.forEach(w=>{
    const s=wsStats(w), d=document.createElement('div');
    d.className='ws-item'+(currentWs&&currentWs.id===w.id?' active':'');
    const img=w.image_url?`<img src="${esc(w.image_url)}">`:'<div class="ph"></div>';
    const badge=s?`<span class="badge ${s.miss===0?'full':'part'}">${s.have}/${s.total}</span>`:`<span class="badge">${w.clip_count||0}</span>`;
    d.innerHTML=img+`<div class="meta"><div class="name">${esc(w.name||'—')}</div></div>`+badge;
    d.onclick=()=>openWorkspace(w); el.appendChild(d);
  });
}
async function openWorkspace(w){
  currentWs=w; selected=new Set(); renderWorkspaces();
  if(!clipsByWs[w.id]){ $('#clipList').innerHTML='<div class="empty">…</div>'; try{ clipsByWs[w.id]=await fetchClips(w); }catch(e){ $('#clipList').innerHTML='<div class="empty">'+esc(''+e)+'</div>'; return; } }
  renderClips(); renderWorkspaces(); renderStats();
}
function originalsOf(cs){ const o=new Set(); cs.forEach(c=>{ const x=c.metadata&&c.metadata.cover_clip_id; if(x) o.add(x); }); return o; }
function renderClips(){
  const t=T(), el=$('#clipList'); if(!el) return;
  const bm=$('#btnWsMissing'), bs=$('#btnSelected');
  if(!currentWs||!clipsByWs[currentWs.id]){ el.innerHTML='<div class="empty">'+esc(t.pickWs)+'</div>'; bm.classList.add('hidden'); bs.classList.add('hidden'); return; }
  const cs=clipsByWs[currentWs.id], orig=originalsOf(cs), q=($('#search').value||'').toLowerCase();
  const miss=cs.filter(c=>!localIds[c.id]).length;
  bm.classList.remove('hidden'); bm.textContent=t.wsMissing(miss); bm.disabled=!miss||!!(job&&job.running);
  bs.classList.toggle('hidden',!selected.size); bs.textContent=t.selected(selected.size); bs.disabled=!!(job&&job.running);
  let list=cs.filter(c=>!q||(c.title||'').toLowerCase().includes(q)||((c.metadata&&c.metadata.tags)||'').toLowerCase().includes(q));
  list.sort((a,b)=>{ const ao=orig.has(a.id)?0:1,bo=orig.has(b.id)?0:1; return ao!==bo?ao-bo:(b.created_at||'').localeCompare(a.created_at||''); });
  if(!list.length){ el.innerHTML='<div class="empty">'+esc(t.noTracks)+'</div>'; return; }
  el.innerHTML='';
  list.forEach(c=>{
    const has=!!localIds[c.id], o=orig.has(c.id), d=document.createElement('div');
    d.className='clip'+(o?' orig':'');
    const img=c.image_url?`<img src="${esc(c.image_url)}">`:'<div class="ph"></div>';
    d.innerHTML=`<input type="checkbox" ${selected.has(c.id)?'checked':''} ${has?'disabled':''} onchange="toggleSel('${c.id}',this.checked)">`+
      `<span class="avail">${has?'✅':'🫥'}</span>`+img+
      `<div class="t"><div class="title">${o?'<span class="star">★ </span>':''}${esc(c.title||'—')}</div><div class="tags">${esc((c.metadata&&c.metadata.tags)||'')}</div></div>`+
      `<button class="small" onclick="play('${c.id}')">▶</button>`;
    el.appendChild(d);
  });
}
function toggleSel(id,on){ on?selected.add(id):selected.delete(id); renderClips(); }

/* ============================== download job ============================== */
function trackNumbers(cs){ const r={}; cs.slice().sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||'')).forEach((c,i)=>r[c.id]=i+1); return r; }
function itemsFor(w,filter){ const cs=clipsByWs[w.id]||[], nums=trackNumbers(cs); return cs.filter(filter).map(c=>({clip:c,ws:w.name||'Misc',track:nums[c.id]})); }
function confirmStart(n){ const t=T(); let m=t.confirmAll(n); if(ACC&&ACC.ok&&!ACC.pro) m+=t.confirmFree; return confirm(m); }
function downloadEverything(){
  const items=[]; workspaces.forEach(w=>items.push(...itemsFor(w,c=>!localIds[c.id])));
  if(!items.length){ toast(T().nothingMissing); return; }
  if(confirmStart(items.length)) runJob(items);
}
function downloadWorkspaceMissing(){ if(!currentWs) return; const items=itemsFor(currentWs,c=>!localIds[c.id]); if(!items.length){ toast(T().nothingMissing); return; } if(confirmStart(items.length)) runJob(items); }
function downloadSelected(){ if(!currentWs||!selected.size) return; const items=itemsFor(currentWs,c=>selected.has(c.id)&&!localIds[c.id]); selected=new Set(); if(items.length) runJob(items); }
async function runJob(items){
  job={items,i:0,ok:0,bad:0,skip:0,fails:[],running:true,stop:false}; renderAll();
  for(job.i=0; job.i<items.length; job.i++){
    if(job.stop) break;
    const it=items[job.i], c=it.clip; renderJob();
    if(localIds[c.id]){ job.skip++; continue; }
    const body={clipId:c.id,audioUrl:c.audio_url,title:c.title,artist:c.display_name||'Suno',workspace:it.ws,disc:1,track:it.track,
      tags:(c.metadata&&c.metadata.tags)||'',imageUrl:c.image_large_url||c.image_url||'',lyrics:(c.metadata&&c.metadata.prompt)||'',createdAt:c.created_at||''};
    let r; try{ r=await post('/api/download',body); }catch(e){ r={ok:false,error:''+e}; }
    if(r.ok){ job.ok++; localIds[c.id]=true; } else { job.bad++; job.fails.push({title:c.title||c.id,ws:it.ws,error:errText(r)}); }
    if(job.i%3===0){ renderStats(); renderWorkspaces(); renderClips(); }
  }
  job.running=false; renderAll();
  toast(T().jobDone(job.ok,job.bad),6000);
}
function stopJob(){ if(job&&job.running){ job.stop=true; $('#jobNow').textContent=T().stopping; } }
function renderJob(){
  const t=T(); if(!$('#jobBox')) return;
  const active=!!job;
  $('#jobIdle').classList.toggle('hidden',active); $('#jobBox').classList.toggle('hidden',!active);
  if(!active){ $('#failList').innerHTML=''; return; }
  const n=job.items.length, i=Math.min(job.i+1,n), cur=job.items[Math.min(job.i,n-1)];
  $('#jobStep').textContent=t.jobStep(job.running?i:n,n);
  if(!job.stop) $('#jobNow').textContent=job.running&&cur?`${cur.ws} — ${cur.clip.title||''}`:t.jobDone(job.ok,job.bad);
  $('#jobBar').style.width=(100*(job.running?job.i:n)/Math.max(1,n))+'%';
  $('#cOk').textContent=t.cOk(job.ok); $('#cBad').textContent=job.bad?t.cBad(job.bad):''; $('#cSkip').textContent=job.skip?t.cSkip(job.skip):'';
  $('#btnStop').classList.toggle('hidden',!job.running);
  $('#failList').innerHTML=job.fails.slice(-30).reverse().map(f=>`<div class="fail"><b>${esc(f.ws)} — ${esc(f.title)}</b>${esc(f.error)}</div>`).join('');
}

/* ============================== player ============================== */
function findClip(id){ for(const k in clipsByWs){ const c=(clipsByWs[k]||[]).find(x=>x.id===id); if(c) return c; } return null; }
function play(id){
  const t=T(), c=findClip(id); if(!c) return; player.clip=c; const a=$('#audio'), has=!!localIds[id];
  a.src=has?('/api/play?id='+id):(c.audio_url||'');
  $('#pName').textContent=c.title||'—'; $('#pSub').textContent=has?t.localFile:(c.audio_url?t.sunoStream:t.noSource);
  $('#player').classList.add('show'); alignedWords=null; a.play().catch(()=>{});
}
async function openKaraoke(){
  const c=player.clip; if(!c) return; $('#karaoke').classList.add('show'); $('#karaokeLine').textContent='…';
  try{ const d=await api('/api/lyrics?id='+c.id); const w=d.aligned_words||[];
    if(w.length){ alignedWords=w.map(x=>({t:esc(x.word||''),s:x.start_s||0,e:x.end_s||0})); $('#karaokeLine').innerHTML=alignedWords.map((x,i)=>`<span class="w" id="kw${i}">${x.t}</span>`).join(' '); }
    else $('#karaokeLine').innerHTML=esc((c.metadata&&c.metadata.prompt)||'—').replace(/\n/g,'<br>');
  }catch(e){ $('#karaokeLine').textContent='—'; }
}
function closeKaraoke(){ $('#karaoke').classList.remove('show'); }
$('#audio').addEventListener('timeupdate',()=>{ if(!alignedWords) return; const t=$('#audio').currentTime;
  alignedWords.forEach((w,i)=>{ const s=document.getElementById('kw'+i); if(s) s.classList.toggle('on',t>=w.s&&t<=w.e); }); });
</script>
</body>
