<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNODLAA</title>
<link rel="icon" href="assets/logo.png">
<style>
  :root{
    --fuchsia:#E81E8C; --turq:#009B8E; --yellow:#FFC531; --orange:#F57C00; --cobalt:#2B6BFF;
    --bg:#FFF9FC; --bg2:#FBEAF3; --card:#fff; --ink:#1B1B1F; --muted:#7A6B75; --border:#EBD5E4;
    --gold:#E3B341; --ok:#0A9A5B; --warn:#F57C00; --bad:#D32F4B;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  button,select,input,textarea{font:inherit}
  button{cursor:pointer;border:none;border-radius:10px;padding:8px 14px;background:var(--bg2);color:var(--ink)}
  button:hover:not(:disabled){filter:brightness(1.04)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:linear-gradient(90deg,var(--fuchsia),var(--orange));color:#fff;font-weight:700}
  button.go{background:linear-gradient(90deg,var(--turq),var(--cobalt));color:#fff;font-weight:800}
  button.big{font-size:16px;padding:12px 22px;border-radius:14px}
  button.small{padding:5px 10px;font-size:12px}
  input[type=text],textarea,select{background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:8px}
  .hidden{display:none!important}
  .muted{color:var(--muted)} .small-t{font-size:12px}

  header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  header img{height:38px;width:38px;border-radius:50%}
  .brand{display:flex;flex-direction:column;line-height:1.1}
  .brand b{font-size:16px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--fuchsia),var(--orange),var(--turq),var(--cobalt));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand span{font-size:11px;color:var(--muted)}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
  .chip.ok{background:#E3F6EE;color:var(--ok)} .chip.pro{background:linear-gradient(90deg,#FFE9A8,#FFD0E6);color:#7A4A00;font-weight:700} .chip.bad{background:#FDE3E8;color:var(--bad)}
  .spacer{flex:1}

  /* ---------- setup wizard ---------- */
  #setup{max-width:860px;margin:28px auto;padding:0 16px 60px}
  #setup h1{margin:0 0 4px;font-size:24px}
  .step{display:flex;gap:16px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:16px;transition:opacity .2s}
  .step.locked{opacity:.45;pointer-events:none}
  .step.current{border:2px solid var(--fuchsia);box-shadow:0 8px 28px rgba(232,30,140,.12)}
  .step .num{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--fuchsia),var(--orange))}
  .step.done .num{background:var(--ok)}
  .step .body{flex:1;min-width:0}
  .step h3{margin:6px 0 4px;font-size:17px}
  .step p{margin:4px 0 12px;color:var(--muted)}
  .status{margin-top:10px;font-size:13px;min-height:18px}
  .status.ok{color:var(--ok);font-weight:600} .status.bad{color:var(--bad)}
  .pathbox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg2);font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
  details{margin-top:12px} summary{cursor:pointer;color:var(--muted);font-size:13px}
  .helpsteps{margin:8px 0 0 18px;padding:0} .helpsteps li{margin:4px 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .row input[type=text]{flex:1;min-width:220px}
  .presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
  .preset{border:2px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;background:#fff}
  .preset.sel{border-color:var(--fuchsia);background:#FFF3F9}
  .preset b{display:block;margin-bottom:6px}
  .preset code{font-size:12px;color:var(--muted);word-break:break-all}
  .formats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .formats label{border:2px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;flex:1;min-width:220px;background:#fff}
  .formats label.sel{border-color:var(--turq);background:#EFFCFA}
  .preview{margin-top:14px;padding:12px;border-radius:12px;background:#1B1B1F;color:#fff;font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
  .preview .dim{color:#A99BA5}
  .finish{text-align:center;margin-top:24px}

  /* ---------- library ---------- */
  #library{display:flex;flex-direction:column;height:calc(100vh - 55px)}
  .banner{margin:10px 16px 0;padding:10px 14px;border-radius:12px;background:#FFF4E0;color:#7A4A00;border:1px solid #FFD699}
  .hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:12px 16px 0;padding:16px 18px;border-radius:18px;background:#fff;border:1px solid var(--border)}
  .stats{display:flex;gap:18px;flex-wrap:wrap;flex:1}
  .stat b{display:block;font-size:22px} .stat span{font-size:12px;color:var(--muted)}
  .stat.miss b{color:var(--orange)} .stat.have b{color:var(--ok)}
  .analyzing{flex-basis:100%;font-size:12px;color:var(--muted)}
  .bar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fuchsia),var(--orange));transition:width .3s}
  .cols{flex:1;display:grid;grid-template-columns:320px 1fr 320px;min-height:0;margin-top:12px;border-top:1px solid var(--border)}
  .col{overflow:auto;padding:10px}
  .col.ws{border-right:1px solid var(--border)} .col.job{border-left:1px solid var(--border);background:#fff}
  .ptitle{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 4px 8px;font-weight:700}
  .ws-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}
  .ws-item:hover{background:var(--bg2)} .ws-item.active{background:var(--bg2);outline:2px solid var(--fuchsia)}
  .ws-item img,.ws-item .ph{width:42px;height:42px;border-radius:10px;object-fit:cover;background:linear-gradient(135deg,var(--fuchsia),var(--turq));flex:none}
  .ws-item .meta{min-width:0;flex:1} .ws-item .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
  .badge.full{background:#E3F6EE;color:var(--ok)} .badge.part{background:#FFF1DE;color:var(--orange)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .toolbar input{flex:1;min-width:140px}
  .clip{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:12px}
  .clip:hover{background:var(--bg2)}
  .clip.orig{background:linear-gradient(90deg,rgba(255,197,49,.28),transparent);outline:1px solid var(--gold)}
  .clip img,.clip .ph{width:40px;height:40px;border-radius:8px;object-fit:cover;background:linear-gradient(135deg,var(--orange),var(--fuchsia));flex:none}
  .clip .t{min-width:0;flex:1} .clip .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .clip .title .star{color:var(--gold)} .clip .tags{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clip input{width:18px;height:18px;accent-color:var(--fuchsia)}
  .avail{width:22px;text-align:center;flex:none}
  .empty{color:var(--muted);text-align:center;padding:36px 10px}
  .jobbox{border-radius:14px;padding:12px;background:var(--bg2)}
  .jobbox .now{font-weight:700;margin:6px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .counts{display:flex;gap:12px;font-size:12px;margin-top:8px;flex-wrap:wrap}
  .counts .c-ok{color:var(--ok)} .counts .c-bad{color:var(--bad)} .counts .c-skip{color:var(--muted)}
  .fail{font-size:12px;padding:6px 8px;border-radius:8px;background:#FDE3E8;margin-top:6px}
  .fail b{display:block}
  .col.job{display:flex;flex-direction:column;gap:10px}
  #failList{max-height:22vh;overflow:auto}
  .col.job #jobIdle{padding:8px 6px;font-size:12px}
  .clip.playing{background:#FFF0F7;outline:1px solid var(--fuchsia)}
  .pc-art{height:140px}
  .pcard{border-radius:18px;background:#fff;border:1px solid var(--border);overflow:hidden;box-shadow:0 8px 28px rgba(232,30,140,.08)}
  .pcard .ptitle{margin:10px 12px 6px}
  #pcEmpty{padding:6px 12px 14px;text-align:center}
  .pc-art{height:170px;background:linear-gradient(135deg,var(--fuchsia),var(--orange),var(--turq));background-size:cover;background-position:center;position:relative}
  .pc-art.noimg::after{content:'♫';position:absolute;inset:0;display:grid;place-items:center;font-size:64px;color:rgba(255,255,255,.85);pointer-events:none}
  .pc-art .kbtn{position:absolute;right:8px;top:8px;z-index:1;background:rgba(255,255,255,.9);padding:5px 10px;font-weight:700}
  .pc-info{padding:10px 12px 0}
  .pc-t{font-weight:800;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pc-s{color:var(--muted);font-size:12px;margin-top:2px}
  .src{font-size:11px;padding:2px 8px;border-radius:999px;display:inline-block;margin-top:6px}
  .src.loc{background:#E3F6EE;color:var(--ok)} .src.cloud{background:#E6EEFF;color:var(--cobalt)}
  .pc-seek{display:flex;align-items:center;gap:8px;padding:10px 12px 0;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pc-seek input{flex:1}
  input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--fuchsia) 0,var(--orange) var(--p,0%),var(--bg2) var(--p,0%));outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--fuchsia);box-shadow:0 1px 4px rgba(0,0,0,.2)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--fuchsia)}
  #pcVol{--p:90%;width:90px}
  .pc-ctrl{display:flex;justify-content:center;align-items:center;gap:8px;padding:8px 12px}
  .pc-ctrl button{background:transparent;font-size:18px;padding:6px 8px;border-radius:50%}
  .pc-ctrl button:hover{background:var(--bg2)}
  .pc-ctrl button.on{color:var(--fuchsia);background:#FFF0F7}
  .pc-ctrl .pc-play{width:52px;height:52px;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--fuchsia),var(--orange));box-shadow:0 6px 18px rgba(232,30,140,.35)}
  .pc-ctrl .pc-play:hover{background:linear-gradient(135deg,var(--fuchsia),var(--orange));filter:brightness(1.08)}
  .pc-vol{display:flex;align-items:center;gap:6px;justify-content:center;font-size:13px;padding-bottom:6px}
  .pc-path{padding:0 12px 8px;font-size:11px;color:var(--muted);word-break:break-all;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .pc-tabs{display:flex;border-top:1px solid var(--border)}
  .pc-tabs button{flex:1;border-radius:0;background:#fff;font-size:12px;padding:8px}
  .pc-tabs button.on{background:var(--bg2);font-weight:700}
  #pcLyr,#pcQueue{max-height:32vh;overflow:auto;padding:8px 12px 12px;position:relative}
  .ly{padding:3px 0;color:var(--muted);cursor:pointer;transition:all .2s;font-size:14px}
  .ly.on{color:var(--ink);font-weight:800;font-size:16px}
  .ly.static{cursor:default;white-space:normal}
  .qi{display:flex;gap:8px;align-items:center;padding:6px 4px;border-radius:10px;cursor:pointer;font-size:13px}
  .qi:hover{background:var(--bg2)} .qi .n{width:20px;color:var(--muted);text-align:right;font-size:11px}
  .qi .qt{flex:1;min-width:0} .qi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .qi span{font-size:11px;color:var(--muted)}
  .clip .path{font-size:11px;color:var(--ok);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Consolas,monospace}
  .wshead .folder{font-size:12px;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .wshead .folder code{font-size:11px;background:var(--bg2);padding:2px 6px;border-radius:6px;word-break:break-all}
  .notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ok);padding:12px 16px;border-radius:14px;z-index:60;max-width:min(680px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.18);word-break:break-all}
  .dots{padding:5px 8px;font-weight:800}
  .clip .del{padding:5px 7px;opacity:.55} .clip .del:hover{opacity:1;background:#FDE3E8}
  .clip .tno{width:30px;flex:none;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace}
  .clip.orig .tno{color:#9A6B00;font-weight:700}
  button.hot{background:linear-gradient(90deg,#FFF1C9,#FFE0EF);color:#7A4A00;font-weight:700}
  .batchbar{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;margin-bottom:8px;border-radius:12px;background:var(--ink);color:#fff}
  .batchbar button{background:rgba(255,255,255,.14);color:#fff} .batchbar button.danger{background:var(--bad)} .batchbar button:disabled{opacity:.4}
  .pchead{display:flex;align-items:center;justify-content:space-between;padding-right:8px}
  .pc-panel{display:block} .pc-panel:not(.open){display:none}
  .sortseg{align-items:center} .sortseg .muted{margin-right:2px}
  .wstools .sortseg button{padding:4px 9px}
  /* mini player window */
  body.minibody{margin:0;background:var(--bg);height:100vh;overflow:hidden}
  .pcard.mini{border:none;border-radius:0;height:100vh;display:flex;flex-direction:column;box-shadow:none}
  .pcard.mini #pcBody{display:flex;flex-direction:column;flex:1;min-height:0}
  .pcard.mini #pcBody.hidden{display:none}
  .pcard.mini .pc-art{height:auto;aspect-ratio:1/1;max-height:42vh;flex:none}
  .pcard.mini .pc-panel{flex:1;min-height:0;display:flex;flex-direction:column}
  .pcard.mini #pcLyr,.pcard.mini #pcQueue{max-height:none;flex:1}
  .pcard.mini .pc-path{display:none}
  /* floating bar (Spotify-like) */
  .pcard.floating{position:fixed;left:0;right:0;bottom:0;z-index:45;border-radius:0;border:none;border-top:1px solid var(--border);box-shadow:0 -8px 30px rgba(0,0,0,.08);overflow:visible}
  .pcard.floating.nocur{display:none}
  .pcard.floating .pchead{position:absolute;right:6px;top:6px;padding:0;z-index:2} .pcard.floating .pchead .ptitle{display:none}
  .pcard.floating #pcEmpty{display:none}
  .pcard.floating #pcBody{display:grid;grid-template-columns:minmax(220px,1fr) minmax(300px,2fr) minmax(220px,1fr);grid-template-areas:"art ctrl vol" "art seek tabs";align-items:center;column-gap:16px;padding:8px 44px 8px 12px}
  .pcard.floating #pcBody.hidden{display:none}
  .pcard.floating .pc-art{grid-area:art;height:56px;width:56px;border-radius:8px;flex:none}
  .pcard.floating .pc-art .kbtn{display:none}
  .pcard.floating .pc-art.noimg::after{font-size:24px}
  .pcard.floating .pc-info{position:absolute;left:80px;top:12px;width:calc(33% - 90px);padding:0}
  .pcard.floating .pc-t{font-size:14px;-webkit-line-clamp:1} .pcard.floating #pcSrc{display:none}
  .pcard.floating .pc-ctrl{grid-area:ctrl;padding:0} .pcard.floating .pc-ctrl .pc-play{width:40px;height:40px;font-size:18px}
  .pcard.floating .pc-seek{grid-area:seek;padding:0}
  .pcard.floating .pc-vol{grid-area:vol;justify-content:flex-end;padding:0}
  .pcard.floating .pc-path{display:none}
  .pcard.floating .pc-tabs{grid-area:tabs;border:none;justify-content:flex-end;gap:4px}
  .pcard.floating .pc-tabs button{flex:none;border-radius:999px;padding:4px 10px}
  .pcard.floating .pc-panel{position:absolute;right:12px;bottom:calc(100% + 8px);width:min(420px,92vw);background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
  .pcard.floating #pcLyr,.pcard.floating #pcQueue{max-height:50vh}
  body.has-bar #library{height:calc(100vh - 55px - 76px)}
  body.has-bar .toast{bottom:90px}
  @media (max-width:800px){ .pcard.floating #pcBody{grid-template-columns:1fr;grid-template-areas:"ctrl" "seek"} .pcard.floating .pc-art,.pcard.floating .pc-info,.pcard.floating .pc-vol,.pcard.floating .pc-tabs{display:none} }
  .menu{position:fixed;z-index:70;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;display:flex;flex-direction:column;min-width:220px}
  .menu button{background:#fff;text-align:left;border-radius:8px;padding:8px 10px}
  .menu button:hover{background:var(--bg2)} .menu button.danger{color:var(--bad);background:#fff;font-weight:600} .menu button.danger:hover{background:#FDE3E8}
  button.danger{background:var(--bad);color:#fff;font-weight:700}
  .modal{position:fixed;inset:0;background:rgba(27,27,31,.35);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal .mbox{background:#fff;border-radius:18px;padding:18px;width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal h3{margin:0 0 8px} #modalBody{overflow:auto;min-height:0}
  .mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .plan{margin-top:10px;display:flex;flex-direction:column;gap:4px}
  .prow{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:13px}
  .prow:hover{background:var(--bg2)} .prow .from{color:var(--muted);text-decoration:line-through;word-break:break-all} .prow .to{color:var(--ok);font-weight:600;word-break:break-all}
  .prow .newt{width:100%;margin-top:4px;padding:5px 8px}
  .wstools2{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  #stepBackup .num{background:linear-gradient(135deg,var(--turq),var(--cobalt));font-size:18px}
  #backupInfo{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.9} #backupInfo code{background:var(--bg2);padding:1px 6px;border-radius:6px;word-break:break-all}
  .karaoke{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:#1a0c17;color:#fff;overflow:hidden}
  .karaoke.show{display:flex}
  .k-bg{position:absolute;inset:-60px;background:linear-gradient(135deg,var(--fuchsia),var(--orange),var(--turq));background-size:cover;background-position:center;filter:blur(50px) brightness(.4);transform:scale(1.15)}
  .k-top,.k-lines,.k-ctrl,.lyfollow.k{position:relative;z-index:1}
  .k-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px}
  .k-t{font-size:20px;font-weight:800} .k-s{font-size:13px;opacity:.7}
  .k-x{background:rgba(255,255,255,.15);color:#fff;font-size:18px;border-radius:50%;width:40px;height:40px;padding:0}
  .k-lines{flex:1;overflow:auto;padding:32vh 8vw;text-align:center;scrollbar-width:none}
  .k-lines::-webkit-scrollbar{display:none}
  .k-lines .ly{font-size:30px;line-height:1.3;padding:10px 0;color:rgba(255,255,255,.32);font-weight:800;cursor:pointer;transition:color .25s,transform .25s}
  .k-lines .ly.past{color:rgba(255,255,255,.55)}
  .k-lines .ly.on{color:#fff;transform:scale(1.12)}
  .k-lines .ly.on .w{transition:color .12s} .k-lines .ly.on .w.sung{color:#FF7AC0;text-shadow:0 0 18px rgba(255,122,192,.55)}
  .k-lines .ly.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#7FE3D8;cursor:default;padding-top:26px}
  .k-ctrl{display:flex;justify-content:center;gap:16px;padding:14px}
  .k-ctrl button{background:rgba(255,255,255,.14);color:#fff;border-radius:50%;width:48px;height:48px;font-size:18px;padding:0}
  .k-ctrl .k-play{width:60px;height:60px;font-size:22px;background:linear-gradient(135deg,var(--fuchsia),var(--orange))}
  .lyfollow{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:3;border-radius:999px;padding:7px 14px;font-weight:700;background:var(--ink);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .lyfollow.k{position:absolute;bottom:92px;background:#fff;color:var(--ink)}
  .pc-panel{position:relative}
  #pcLyr{position:relative}
  .ly.on .w.sung{color:var(--fuchsia)} .ly.past{opacity:.6}
  .ly.sec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--turq);cursor:default;margin-top:8px}
  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;display:none;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .stat.loc b{color:var(--cobalt)}
  .syncrow{display:flex;gap:18px;flex-wrap:wrap}
  .wstools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 4px 8px}
  .wstools input[type=text]{flex:1;min-width:120px;padding:6px 8px}
  .wstools select{padding:6px}
  .chk{display:flex;align-items:center;gap:4px;cursor:pointer}
  .ws-item .sub{font-size:11px;color:var(--muted);line-height:1.35}
  .ws-item.all .ph{background:linear-gradient(135deg,var(--turq),var(--cobalt));display:grid;place-items:center;color:#fff;font-size:20px}
  .ws-item.orph .ph{background:linear-gradient(135deg,var(--cobalt),var(--muted));display:grid;place-items:center;color:#fff;font-size:20px}
  .ws-sep{height:1px;background:var(--border);margin:6px 4px}
  .badge.loc{background:#E6EEFF;color:var(--cobalt)}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{padding:5px 10px;font-size:12px;border-radius:999px}
  .seg button.on{background:var(--ink);color:#fff}
  .wshead{display:flex;gap:12px;align-items:center;margin:2px 0 10px}
  .wshead img,.wshead .ph{width:52px;height:52px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,var(--fuchsia),var(--turq));flex:none}
  .wshead h2{margin:0;font-size:18px}
  .clip .sub2{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clip .sub2 .ws{color:var(--cobalt);font-weight:600}
  .clip .heart{color:var(--fuchsia)}
  .more{text-align:center;margin:10px}
  .localonly{margin-top:16px;border-top:1px dashed var(--border);padding-top:8px}
  .localonly summary{font-weight:700;color:var(--cobalt)}
  .lfile{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:10px;font-size:13px}
  .lfile:hover{background:var(--bg2)} .lfile .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lfile .dir{color:var(--muted);font-size:11px}
  @media (max-width:1000px){ .cols{grid-template-columns:1fr} .col.ws,.col.job{border:none} }
</style>
</head>
<body>
<header>
  <img src="assets/logo.png" alt="">
  <div class="brand"><b>SUNODLAA</b><span>SunoAAWeb</span></div>
  <span id="acctChip" class="chip hidden"></span>
  <span class="spacer"></span>
  <button class="small hidden" id="btnLibrary" onclick="openLibrary()"></button>
  <button class="small" id="btnBackup" onclick="doBackup()"></button>
  <button class="small" id="btnSetup" onclick="showSetup()"></button>
</header>

<!-- ======================= SETUP / WIZARD ======================= -->
<section id="setup" class="hidden">
  <div class="row" style="justify-content:space-between;margin-top:0">
    <div>
      <h1 id="sTitle"></h1>
      <div class="muted" id="sIntro"></div>
    </div>
    <label class="small-t muted"><span id="sLangLbl"></span>
      <select id="langSel" onchange="setLang(this.value)"><option value="en">English</option><option value="fr">Français</option></select>
    </label>
  </div>

  <div class="step" id="step1">
    <div class="num">1</div>
    <div class="body">
      <h3 id="s1Title"></h3>
      <p id="s1Text"></p>
      <button class="primary big" id="btnConnect" onclick="doLogin()"></button>
      <div class="status" id="s1Status"></div>
      <details id="s1Help">
        <summary id="s1HelpSum"></summary>
        <ol class="helpsteps" id="s1HelpSteps"></ol>
        <div class="row"><input type="text" id="cookieInput" placeholder="__client = …"><button id="btnCookie" onclick="saveCookie()"></button></div>
      </details>
    </div>
  </div>

  <div class="step" id="step2">
    <div class="num">2</div>
    <div class="body">
      <h3 id="s2Title"></h3>
      <p id="s2Text"></p>
      <button class="primary big" id="btnPick" onclick="pickFolder()"></button>
      <div class="pathbox hidden" id="libPath"></div>
      <div class="status" id="s2Status"></div>
      <details id="s2Type">
        <summary id="s2TypeSum"></summary>
        <div class="row"><input type="text" id="libInput" placeholder="P:\Music"><button id="btnLibOk" onclick="saveLibPath()">OK</button></div>
      </details>
    </div>
  </div>

  <div class="step" id="step3">
    <div class="num">3</div>
    <div class="body">
      <h3 id="s3Title"></h3>
      <p id="s3Text"></p>
      <div class="presets" id="presets"></div>
      <div id="customBox" class="hidden">
        <div class="row"><span class="small-t muted" style="width:120px" id="lblFolderPat"></span><input type="text" id="folderPat" oninput="customChanged()"></div>
        <div class="row"><span class="small-t muted" style="width:120px" id="lblFilePat"></span><input type="text" id="filePat" oninput="customChanged()"></div>
        <div class="small-t muted" style="margin-top:6px" id="tokensHelp"></div>
      </div>
      <div style="margin-top:14px;font-weight:700" id="lblQuality"></div>
      <div class="formats" id="formats"></div>
      <label class="small-t" style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;cursor:pointer"><input type="checkbox" id="lrcBox" style="margin-top:2px" onchange="saveOpts({saveLrc:this.checked})"><span id="lblLrc" style="flex:1"></span></label>
      <div class="preview" id="preview"></div>
    </div>
  </div>

  <div class="step" id="stepBackup">
    <div class="num">💾</div>
    <div class="body">
      <h3 id="sbTitle"></h3>
      <p id="sbText"></p>
      <div class="row"><button class="primary" id="btnBackup2" onclick="doBackup()"></button><button id="btnRestore" onclick="doRestore()"></button></div>
      <input type="file" id="restoreFile" accept=".json,application/json" class="hidden" onchange="doRestoreFile(this)">
      <div id="backupInfo"></div>
    </div>
  </div>

  <details id="advanced" style="margin-top:18px">
    <summary id="advSum"></summary>
    <div class="step" style="margin-top:10px"><div class="body">
      <div class="row"><span id="lblDelay"></span><input type="text" id="delayInput" style="max-width:70px" onchange="saveOpts({downloadDelaySec:+this.value||0})"><span class="muted small-t" id="lblDelayHint"></span></div>
      <div class="row"><button id="btnRenameFolders" onclick="applyFolders()"></button><span class="muted small-t" id="lblRenameHint"></span></div>
    </div></div>
  </details>

  <div class="finish"><button class="go big" id="btnFinish" onclick="openLibrary()"></button></div>
</section>

<!-- ======================= LIBRARY ======================= -->
<section id="library" class="hidden">
  <div class="banner hidden" id="freeBanner"></div>
  <div class="hero">
    <div class="stats">
      <div class="stat"><b id="nTracks">–</b><span id="lTracks"></span></div>
      <div class="stat"><b id="nWs">–</b><span id="lWs"></span></div>
      <div class="stat have"><b id="nHave">–</b><span id="lHave"></span></div>
      <div class="stat miss"><b id="nMiss">–</b><span id="lMiss"></span></div>
      <div class="stat loc"><b id="nLocal">–</b><span id="lLocal"></span></div>
    </div>
    <button class="go big" id="btnEverything" onclick="downloadEverything()"></button>
    <button class="small hot hidden" id="btnCleanAll" onclick="openCleanAll()"></button>
    <button class="small" id="btnRecheck" onclick="refreshAll()"></button>
    <div class="analyzing" id="syncBox">
      <div class="syncrow"><span id="syncSuno"></span><span id="syncDisk"></span></div>
      <div class="bar hidden" id="syncBarBox"><i id="syncBar"></i></div>
    </div>
  </div>
  <div class="cols">
    <div class="col ws">
      <div class="ptitle" id="tWs"></div>
      <div class="wstools">
        <input type="text" id="wsSearch" oninput="F.wsQ=this.value;renderWorkspaces()">
        <div class="seg sortseg" id="wsSortSeg"></div>
        <label class="small-t muted chk"><input type="checkbox" id="wsIncomplete" onchange="F.incomplete=this.checked;savePrefs();renderWorkspaces()"> <span id="lblIncomplete"></span></label>
      </div>
      <div id="wsList"></div>
    </div>
    <div class="col">
      <div id="wsHead"></div>
      <div class="toolbar">
        <input type="text" id="search" oninput="F.limit=300;renderClips()">
        <div class="seg sortseg" id="sortSeg"></div>
      </div>
      <div class="toolbar">
        <label class="chk small-t" id="selAllBox"><input type="checkbox" id="selAll" onchange="selectAllView(this.checked)"> <span id="lblSelAll"></span></label>
        <div class="seg" id="filterSeg"></div>
        <span class="spacer"></span>
        <button class="small" id="btnPlayView" onclick="playAllView(false)">▶</button><button class="small" id="btnShufView" onclick="playAllView(true)">🔀</button>
        <button class="small" id="btnWsMissing" onclick="downloadViewMissing()"></button>

      </div>
      <div class="batchbar hidden" id="batchBar"></div>
      <div id="clipList"></div>
    </div>
    <div class="col job">
      <div class="ptitle" id="tJob"></div>
      <div id="jobIdle" class="empty"></div>
      <div id="jobBox" class="jobbox hidden">
        <div class="small-t muted" id="jobStep"></div>
        <div class="now" id="jobNow"></div>
        <div class="bar"><i id="jobBar"></i></div>
        <div class="counts"><span class="c-ok" id="cOk"></span><span class="c-bad" id="cBad"></span><span class="c-skip" id="cSkip"></span></div>
        <div class="row"><button class="small" id="btnStop" onclick="stopJob()"></button></div>
      </div>
      <div id="failList"></div>
      <div class="jobbox hidden" id="miniNote"></div>
      <div id="dockHome"><div class="pcard" id="pcard">
        <div class="pchead"><div class="ptitle" id="pcHead"></div><span><button class="small" id="pcMiniBtn" onclick="toggleMini()">⧉</button> <button class="small" id="pcFloatBtn" onclick="toggleFloat()">⇲</button></span></div>
        <div id="pcEmpty"></div>
        <div id="pcBody" class="hidden">
          <div class="pc-art" id="pcArt"><button class="small kbtn" onclick="openKaraoke()" title="Karaoke">🎤 Karaoké ⛶</button></div>
          <div class="pc-info"><div class="pc-t" id="pcTitle"></div><div class="pc-s" id="pcSub"></div><div id="pcSrc"></div></div>
          <div class="pc-seek"><span id="pcCur">0:00</span><input type="range" id="pcSeek" min="0" max="1000" value="0"><span id="pcDur">0:00</span></div>
          <div class="pc-ctrl"><button id="pcShuf" onclick="toggleShuffle()">🔀</button><button onclick="prevTrack()">⏮</button><button class="pc-play" id="pcPlay" onclick="togglePlay()">▶</button><button onclick="nextTrack(false)">⏭</button><button id="pcRep" onclick="cycleRepeat()">🔁</button></div>
          <div class="pc-vol">🔈<input type="range" id="pcVol" min="0" max="100" oninput="this.style.setProperty('--p',this.value+'%')">🔊</div>
          <div class="pc-path" id="pcPath"></div>
          <div class="pc-tabs"><button id="pcTabL" onclick="togglePanel('lyrics')"></button><button id="pcTabQ" onclick="togglePanel('queue')"></button></div>
          <div class="pc-panel" id="pcPanel"><div id="pcLyr"></div><div id="pcQueue" class="hidden"></div><button class="lyfollow hidden" id="pcFollow"></button></div>
        </div>
      </div></div>
      <audio id="audio" preload="metadata"></audio>
    </div>
  </div>
</section>

<div id="floatHome"></div>
<div class="notice hidden" id="notice"></div>
<div class="menu hidden" id="menu"></div>
<div class="modal hidden" id="modal"><div class="mbox"><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="mbtns" id="modalBtns"></div></div></div>
<div class="karaoke" id="karaoke">
  <div class="k-bg" id="kBg"></div>
  <div class="k-top"><div style="min-width:0"><div class="k-t" id="kTitle"></div><div class="k-s" id="kSub"></div></div><button class="k-x" onclick="closeKaraoke()">✕</button></div>
  <div class="k-lines" id="kLines"></div>
  <button class="lyfollow k hidden" id="kFollow"></button>
  <div class="k-ctrl"><button onclick="prevTrack()">⏮</button><button id="kPlay" class="k-play" onclick="togglePlay()">▶</button><button onclick="nextTrack(false)">⏭</button></div>
</div>
<div class="toast" id="toast"></div>

async function syncSuno(force){
  if(syncing) return; syncing=true; syncErr=null; const t0=Date.now(); let fetched=0, errors=0;

    const list=[]; let page=1,total=null;

      const d=await api('/api/suno?path=/api/project/me&page='+page);
      if(d.error) throw new Error(d.error);
      const items=d.projects||[]; list.push(...items); total=d.num_total_results??total;
      if(!items.length||(total!=null&&list.length>=total)) break; page++;
    }
    const fresh=list.map(slimWs), ids=new Set(fresh.map(w=>w.id));
    Object.keys(clipsByWs).forEach(k=>{ if(!ids.has(k)){ delete clipsByWs[k]; delete wsMarker[k]; } });
    workspaces=fresh;
    const todo=fresh.filter(w=>force||!clipsByWs[w.id]||wsMarker[w.id]!==w.marker);
    // the workspace on screen first
    todo.sort((a,b)=>(b.id===currentWs)-(a.id===currentWs));
    syncProg={i:0,n:todo.length}; recomputeMatch(); renderAll();

async function startDiskScan(){

  const s=await post('/api/scan/start').catch(()=>({}));

    scanProg=null; scanErr=st&&st.error;

  };

}
function applyScan(r,fresh){
  if(!r) return; const files=r.files||(r.index&&r.index.files)||[];
  if(!fresh && !files.length) return;
  LOCAL=files; scannedAt=fresh?new Date().toISOString():((r.index&&r.index.scannedAt)||null);
  recomputeMatch(); renderAll();
}
const stripIdx=s=>(s||'').replace(/^\s*\d+(?:[-_ .]+\d+)*\s*(?:[-_.]\s*)?/,'');
function trackNo(p){ const b=(p||'').split(/[\\/]/).pop(); const m=b.match(/^\s*(\d+)(?:[-_ .]+(\d+))?/); return m?+(m[2]||m[1]):null; }
// Link Suno tracks to files: 1) Suno id in the tags (TSRC/TXXX/COMM) or (id8) in the name,
// 2) same title inside the same workspace folder (files without any id only).
function recomputeMatch(){
  MATCH={}; LOCAL_ONLY={}; CLIPWS={}; NUMS_CACHE={};
  const used=new Set(), byId={}, byId8={};
  LOCAL.forEach((f,i)=>{ if(f.id) byId[f.id]=i; else if(f.id8) (byId8[f.id8]=byId8[f.id8]||[]).push(i); });
  for(const w of workspaces) for(const c of (clipsByWs[w.id]||[])){
    CLIPWS[c.id]=w;
    let i=byId[c.id]; if(i==null){ const a=byId8[c.id.slice(0,8)]; if(a&&a.length===1) i=a[0]; }
    if(i!=null&&!used.has(i)){ MATCH[c.id]={p:LOCAL[i].p,k:'id'}; used.add(i); }
  }
  const byFolder={};
  LOCAL.forEach((f,i)=>{ if(used.has(i)||f.id) return; const k=norm(f.w); (byFolder[k]=byFolder[k]||[]).push(i); });
  // 2) the exact file name SUNODLAA would give it (original = 001, then oldest to newest)
  for(const w of workspaces){
    const pool=byFolder[norm(w.name)]; if(!pool) continue;
    const byName={}; pool.forEach(i=>{ if(!used.has(i)) byName[LOCAL[i].p.split(/[\\/]/).pop().replace(/\.[^.]+$/,'').toLowerCase()]=i; });
    (clipsByWs[w.id]||[]).forEach(c=>{ if(MATCH[c.id]) return; const i=byName[expectedBase(c,w).toLowerCase()]; if(i!=null&&!used.has(i)){ MATCH[c.id]={p:LOCAL[i].p,k:'name'}; used.add(i); } });
  }
  for(const w of workspaces){
    const pool=byFolder[norm(w.name)]; if(!pool) continue;
    const cg={}, fg={};
    (clipsByWs[w.id]||[]).forEach(c=>{ if(MATCH[c.id]) return;
      // current Suno title + older titles (tracks renamed on Suno, see cache\title-aliases.json)
      new Set([norm(c.title),...(ALIASES[c.id]||[]).map(a=>norm(stripIdx(a)))]).forEach(k=>{ if(k) (cg[k]=cg[k]||[]).push(c); }); });
    pool.forEach(i=>{ const f=LOCAL[i]; const k=[norm(f.t),norm(f.ft)].find(k=>k&&cg[k]); if(k) (fg[k]=fg[k]||[]).push(i); });
    for(const k in fg){
      const C=cg[k].slice().sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
      const Fi=fg[k].slice().sort((a,b)=>((trackNo(LOCAL[a].p)??1e9)-(trackNo(LOCAL[b].p)??1e9))||collator.compare(LOCAL[a].p,LOCAL[b].p));
      const Cf=C.filter(c=>!MATCH[c.id]), Ff=Fi.filter(i=>!used.has(i));
      for(let j=0;j<Math.min(Cf.length,Ff.length);j++){ MATCH[Cf[j].id]={p:LOCAL[Ff[j]].p,k:'title'}; used.add(Ff[j]); }
    }
  }
  const wsByNorm={}; workspaces.forEach(w=>wsByNorm[norm(w.name)]=w.id);
  LOCAL.forEach((f,i)=>{ if(used.has(i)) return; const id=wsByNorm[norm(f.w)]||ORPH_ID; (LOCAL_ONLY[id]=LOCAL_ONLY[id]||[]).push(f); });
}
function logMatch(){
  let byId=0,byTitle=0,byName=0; for(const k in MATCH) (MATCH[k].k==='id'?byId++:MATCH[k].k==='name'?byName++:byTitle++);
  let lo=0; for(const k in LOCAL_ONLY) lo+=LOCAL_ONLY[k].length;
  logUI(`match: ${LOCAL.length} files on disk, ${nClips()} Suno tracks -> ${byId} by id, ${byName} by expected name, ${byTitle} by title, ${nClips()-byId-byTitle-byName} not on disk (${Object.keys(IGNORED).length} ignored), ${lo} only on disk (${(LOCAL_ONLY[ORPH_ID]||[]).length} in folders unknown to Suno)`);
}

function wsStats(w){

  return {total:cs.length,have,ign,miss:cs.length-have-ign,first,last,local:(LOCAL_ONLY[w.id]||[]).length};
}

  $('#wsSortSeg').innerHTML=[['az',t.wbAZ,t.wsSortAZ],['recent',t.wbRecent,t.wsSortRecent],['miss',t.wbMiss,t.wsSortMiss]].map(([k,n,tip])=>`<button class="${F.wsSort===k?'on':''}" title="${esc(tip)}" onclick="F.wsSort='${k}';savePrefs();renderWorkspaces()">${esc(n)}</button>`).join('');
  if(!workspaces.length){ el.innerHTML='<div class="empty">'+(syncing?'…':esc(syncErr||'…'))+'</div>'; return; }
  const q=norm(F.wsQ);
  let list=workspaces.map(w=>({w,s:wsStats(w)})).filter(x=>(!q||norm(x.w.name).includes(q))&&(!F.incomplete||!x.s||x.s.miss>0));
  if(F.wsSort==='recent') list.sort((a,b)=>((b.s&&b.s.last)||'').localeCompare((a.s&&a.s.last)||''));
  else if(F.wsSort==='miss') list.sort((a,b)=>((b.s&&b.s.miss)||0)-((a.s&&a.s.miss)||0)||collator.compare(a.w.name,b.w.name));
  else list.sort((a,b)=>collator.compare(a.w.name,b.w.name));
  let tot=0,have=0; workspaces.forEach(w=>{ const s=wsStats(w); if(s){ tot+=s.total; have+=s.have; } });
  const rows=[];
  rows.push(`<div class="ws-item all ${currentWs===ALL_ID?'active':''}" onclick="openWorkspace('${ALL_ID}')"><div class="ph">♫</div><div class="meta"><div class="name">${esc(t.allTracks)}</div><div class="sub">${esc(t.allSub(workspaces.length))}</div></div><span class="badge ${tot&&have===tot?'full':'part'}">${have}/${tot}</span></div>`);
  rows.push('<div class="ws-sep"></div>');
  list.forEach(({w,s})=>{
    const img=w.image_url?`<img loading="lazy" src="${esc(w.image_url)}">`:'<div class="ph"></div>';
    const range=s&&s.first?(s.first===s.last?fmtDate(s.first,true):`${fmtDate(s.first,true)} → ${fmtDate(s.last,true)}`):'';
    const badge=s?`<span class="badge ${s.miss===0?'full':'part'}" title="${esc(t.badgeTip)}">${s.have}/${s.total}</span>`:`<span class="badge">${w.clip_count||0}</span>`;
    const loc=s&&s.local?`<span class="badge loc" title="${esc(t.localOnlyTip)}">+${s.local}</span>`:'';
    rows.push(`<div class="ws-item ${currentWs===w.id?'active':''}" onclick="openWorkspace('${w.id}')">${img}<div class="meta"><div class="name">${esc(w.name||'—')}</div><div class="sub">${esc(range)}</div></div>${loc}${badge}</div>`);
  });
  const orph=LOCAL_ONLY[ORPH_ID]||[];
  if(orph.length){ rows.push('<div class="ws-sep"></div>'); rows.push(`<div class="ws-item orph ${currentWs===ORPH_ID?'active':''}" onclick="openWorkspace('${ORPH_ID}')"><div class="ph">📁</div><div class="meta"><div class="name">${esc(t.orphans)}</div><div class="sub">${esc(t.orphansSub)}</div></div><span class="badge loc">${orph.length}</span></div>`); }
  if(!list.length) rows.push('<div class="empty">'+esc(t.noWs)+'</div>');
  el.innerHTML=rows.join('');
}
async function openWorkspace(id){
  currentWs=id; selected=new Set(); F.limit=300; $('#search').value='';

  logUI(`user: open ${id===ALL_ID?'All tracks':id===ORPH_ID?'folders unknown to Suno':'workspace "'+(w&&w.name)+'"'} (${w&&clipsByWs[id]?clipsByWs[id].length+' tracks in cache':'not loaded yet'})`);
  renderWorkspaces(); renderClips();
  if(w && !clipsByWs[id]){
    try{ clipsByWs[id]=await fetchClips(w); wsMarker[id]=w.marker; recomputeMatch(); saveCache(); }
    catch(e){ logUI(`workspace "${w.name}" failed: ${e.message||e}`); if(currentWs===id) $('#clipList').innerHTML='<div class="empty">'+esc(''+e)+'</div>'; return; }
    renderAll();
  }

}

function viewClips(){
  if(currentWs===ALL_ID){ const a=[]; workspaces.forEach(w=>a.push(...(clipsByWs[w.id]||[]))); return a; }
  return clipsByWs[currentWs]||null;
}
function originalsOf(cs){ const o=new Set(); cs.forEach(c=>{ if(c.cover) o.add(c.cover); }); return o; }
function filtered(cs){
  const q=norm($('#search').value);
  return cs.filter(c=>{
    if(F.filter==='have'&&!MATCH[c.id]) return false;
    if(F.filter==='miss'&&!isMissing(c)) return false;
    if(F.filter==='fav'&&!c.is_liked) return false;
    return !q||norm(c.title).includes(q)||norm(c.tags).includes(q);
  });
}

async function deleteLocalFile(i){

function makeItems(cs){ const nums={}; return cs.map(c=>{ const w=CLIPWS[c.id]||{id:'',name:'Misc'}; if(!nums[w.id]) nums[w.id]=trackNumbers(clipsByWs[w.id]||[]); return {clip:c,ws:w.name||'Misc',track:nums[w.id][c.id]||1}; }); }
function confirmStart(n){ const t=T(); let m=t.confirmAll(n); if(ACC&&ACC.ok&&!ACC.pro) m+=t.confirmFree; return confirm(m); }

async function runJob(items,what){
  job={items,i:0,ok:0,bad:0,skip:0,fails:[],running:true,stop:false}; renderAll();
  logUI(`download job start: ${items.length} tracks (${what})`);
  for(job.i=0; job.i<items.length; job.i++){
    if(job.stop) break;
    const it=items[job.i], c=it.clip; renderJob();
    if(MATCH[c.id]){ job.skip++; continue; }
    const body={clipId:c.id,audioUrl:c.audio_url,title:c.title,artist:c.display_name||'Suno',workspace:it.ws,disc:1,track:it.track,
      tags:c.tags||'',imageUrl:c.image_large_url||c.image_url||'',lyrics:c.prompt||'',createdAt:c.created_at||''};
    let r; try{ r=await post('/api/download',body); }catch(e){ r={ok:false,error:''+e}; }
    if(r.ok){ job.ok++; MATCH[c.id]={p:r.path,k:'id'}; LOCAL.push({p:r.path,id:c.id,id8:c.id.slice(0,8),t:c.title,ft:c.title,w:it.ws}); }
    else { job.bad++; job.fails.push({title:c.title||c.id,ws:it.ws,error:errText(r)});
      if(r.code==='not_authorized'&&job.bad>=3&&job.ok===0){ job.stop=true; job.fails.push({title:'—',ws:'',error:T().stopRefused}); } }
    if(job.i%3===0){ renderStats(); renderWorkspaces(); renderClips(); }
  }
  job.running=false; renderAll();
  logUI(`download job end: ${job.ok} ok, ${job.bad} failed, ${job.skip} already there${job.stop?' (stopped)':''}`);
  toast(T().jobDone(job.ok,job.bad),6000);
}
function stopJob(){ if(job&&job.running){ job.stop=true; $('#jobNow').textContent=T().stopping; } }
function renderJob(){
  const t=T(); if(!$('#jobBox')) return;
  const active=!!job;
  $('#jobIdle').classList.toggle('hidden',active); $('#jobBox').classList.toggle('hidden',!active);
  if(!active){ $('#failList').innerHTML=''; return; }
  const n=job.items.length, i=Math.min(job.i+1,n), cur=job.items[Math.min(job.i,n-1)];
  $('#jobStep').textContent=t.jobStep(job.running?i:n,n);
  if(!job.stop) $('#jobNow').textContent=job.running&&cur?`${cur.ws} — ${cur.clip.title||''}`:t.jobDone(job.ok,job.bad);
  $('#jobBar').style.width=(100*(job.running?job.i:n)/Math.max(1,n))+'%';
  $('#cOk').textContent=t.cOk(job.ok); $('#cBad').textContent=job.bad?t.cBad(job.bad):''; $('#cSkip').textContent=job.skip?t.cSkip(job.skip):'';
  $('#btnStop').classList.toggle('hidden',!job.running);
  $('#failList').innerHTML=job.fails.slice(-30).reverse().map(f=>`<div class="fail"><b>${esc(f.ws)} — ${esc(f.title)}</b>${esc(f.error)}</div>`).join('');
}

/* ============================== names (same rules as the server) ============================== */
function sanitizeName(s){ return ((s||'')+'').replace(/[\\/:*?"<>|]/g,'_').trim(); }
function folderNameFor(ws){ const w=sanitizeName(ws)||'Untitled', pat=CFG.folderPattern||'Suno - {workspace}'; return pat.replace(/\{workspace\}/g,w).replace(/<\s*(workspace|album)\s*>/gi,w); }
function fileNameFor(m){
  const pat=CFG.fileNamePattern||'<Disc#:2>-<Track#:3> <Title>';
  let n=pat.replace(/<\s*([^<>:]+?)\s*(?::(\d+))?\s*>/g,(all,key,w)=>{
    const k=key.toLowerCase().replace(/[^a-z0-9#]/g,'');
    if(/^(disc#|disc|discnumber|disquen|disque|cd)$/.test(k)) return String(parseInt(m.disc)||0).padStart(w?+w:2,'0');
    if(/^(track#|track|tracknumber|pisten|piste|no)$/.test(k)) return String(parseInt(m.track)||0).padStart(w?+w:3,'0');
    if(/^(title|titre)$/.test(k)) return m.title||'';
    if(/^(artist|artiste)$/.test(k)) return m.artist||'';
    if(/^(album|workspace)$/.test(k)) return m.workspace||'';
    if(/^(year|annee|anne|date)$/.test(k)) return m.year||'';
    if(/^(genre|style)$/.test(k)) return m.genre||'';
    if(/^(id|isrc)$/.test(k)) return m.id||'';
    if(k==='id8') return (m.id||'').slice(0,8);
    return all;
  });
  n=n.replace(/[\\/:*?"<>|]/g,'_').trim().replace(/\.+$/,'');
  return n||'Untitled';
}
const SEP=()=>((CFG.libraryPath||'').includes('/')&&!(CFG.libraryPath||'').includes('\\'))?'/':'\\';
// Track numbers: the original(s) first (= 001), then every other version from oldest to newest.
function trackNumbers(cs){
  const orig=originalsOf(cs), r={};
  cs.slice().sort((a,b)=>((orig.has(b.id)?1:0)-(orig.has(a.id)?1:0))||(a.created_at||'').localeCompare(b.created_at||'')).forEach((c,i)=>r[c.id]=i+1);
  return r;
}
let NUMS_CACHE={};
function numsFor(wsId){ if(!NUMS_CACHE[wsId]) NUMS_CACHE[wsId]=trackNumbers(clipsByWs[wsId]||[]); return NUMS_CACHE[wsId]; }
function expectedBase(c,w){ w=w||CLIPWS[c.id]; if(!w) return null;
  return fileNameFor({disc:1,track:numsFor(w.id)[c.id]||1,title:c.title,artist:c.display_name||'Suno',workspace:w.name,year:(c.created_at||'').slice(0,4),genre:c.tags,id:c.id}); }
function expectedPath(c,ext){ const w=CLIPWS[c.id]; if(!w) return null; const s=SEP();
  return (CFG.libraryPath||'').replace(/[\\/]+$/,'')+s+folderNameFor(w.name)+s+expectedBase(c,w)+'.'+(ext||CFG.audioFormat||'mp3'); }

/* ============================== ignored tracks ============================== */
let IGNORED={};
async function loadIgnored(){ const d=await api('/api/cache/file?name=ignored.json').catch(()=>({})); IGNORED=(d&&typeof d==='object'&&!Array.isArray(d))?d:{}; }
function saveIgnored(){ post('/api/cache/file?name=ignored.json',IGNORED).catch(()=>{}); }
function isMissing(c){ return !MATCH[c.id]&&!IGNORED[c.id]; }
function toggleIgnore(id){ const c=findClip(id); if(IGNORED[id]) delete IGNORED[id]; else IGNORED[id]=1; saveIgnored(); logUI(`user: ${IGNORED[id]?'ignore':'un-ignore'} "${c&&c.title}"`); closeMenu(); renderAll(); }

function closeMenu(){ $('#menu').classList.add('hidden'); }
document.addEventListener('click',e=>{ if(!e.target.closest('#menu')&&!e.target.closest('.dots')) closeMenu(); });
function trackMenu(ev,id){
  ev.stopPropagation(); const t=T(), c=findClip(id); if(!c) return; const m=MATCH[id];
  const items=[
    [`✏️ ${t.mRename}`,`renameTrack('${id}')`],
    m?[`📂 ${t.showInFolder}`,`reveal(MATCH['${id}'].p);closeMenu()`]:null,

/* ============================== rename / delete (cascade Suno -> disk) ============================== */
function extOf(p){ const m=(p||'').match(/\.([^.\\/]+)$/); return m?m[1].toLowerCase():(CFG.audioFormat||'mp3'); }
async function applyTitle(c,newTitle){
  const r=await post('/api/suno/title',{id:c.id,title:newTitle}).catch(e=>({ok:false,error:''+e}));
  if(!r.ok) return {ok:false,error:r.error||('HTTP '+r.status)};
  c.title=newTitle; NUMS_CACHE={};
  const m=MATCH[c.id]; let file=null;
  if(m){ const to=expectedPath(c,extOf(m.p)); const w=CLIPWS[c.id];
    const mv=await post('/api/file/move',{items:[{from:m.p,to,title:newTitle,track:numsFor(w.id)[c.id],album:folderNameFor(w.name)}]}).catch(()=>null);
    const res=mv&&mv.results&&mv.results[0];

/* ============================== clean up ugly titles ============================== */
function cleanTitle(t0){
  let s=(t0||'');
  s=s.replace(/^\s*\[temp\]\s*-\s*/i,'');
  s=s.replace(/^\s*\d{1,2}-\d{2,3}\s*(?:-\s*)?(?=\S)/,'');                               // 01-054 prefix
  s=s.replace(/(^|[_\s-])(?:dur[ée]e|duration)?[_\s-]?\d{1,2}m\d{1,2}s(?=[_\s-]|\(|$)/gi,' ');   // 1m7s, _4m30s, duree_3m50s
  s=s.replace(/(^|[_\s-])x\d+(?:[.,]\d+)?(?=[_\s-]|\(|$)/gi,' ');                             // _x2, _x3.1
  s=s.replace(/\s*\((?:edit|edited|clean|temp)\)/gi,'');                                     // (Edit) (clean)
  s=s.replace(/^[\s_]*\d{1,2}-\d{2,3}\s*(?:-\s*)?(?=\S)/,'');                              // number left after a duration
  s=s.replace(/_+/g,' ').replace(/\s{2,}/g,' ').replace(/^[\s\-–—.]+|[\s\-–—.]+$/g,'').trim();
  return s||(t0||'');
}

async function moveClips(cs,target){
  // group by source workspace: Suno moves from one workspace at a time
  const bySrc={}; cs.forEach(c=>{ const w=CLIPWS[c.id]; if(w&&w.id!==target.id) (bySrc[w.id]=bySrc[w.id]||[]).push(c); });
  const filesBefore={}; cs.forEach(c=>{ if(MATCH[c.id]) filesBefore[c.id]=MATCH[c.id].p; });
  let n=0, err=null;
  for(const sid in bySrc){
    const ids=bySrc[sid].map(c=>c.id);
    const r=await sunoPost(`/api/project/${sid}/clips`,{update_type:'move',metadata:{clip_ids:ids,target_project_id:target.id}});
    if(!r.ok){ err=r.error||('HTTP '+r.status); break; }
    const idset=new Set(ids);
    clipsByWs[sid]=(clipsByWs[sid]||[]).filter(c=>!idset.has(c.id));
    clipsByWs[target.id]=(clipsByWs[target.id]||[]).concat(bySrc[sid]);
    n+=ids.length;
  }
  NUMS_CACHE={}; recomputeMatch();
  // files follow: into the target folder, with the SUNODLAA name
  const items=[]; cs.forEach(c=>{ const p0=filesBefore[c.id]; if(p0&&CLIPWS[c.id]&&CLIPWS[c.id].id===target.id){ const to=expectedPath(c,extOf(p0)); if(to&&to!==p0) items.push({c,from:p0,to}); } });
  let filesOk=0;
  if(items.length){ const r=await post('/api/file/move',{items:items.map(x=>({from:x.from,to:x.to,title:x.c.title,track:numsFor(target.id)[x.c.id],album:folderNameFor(target.name)}))}).catch(()=>null);
    ((r&&r.results)||[]).forEach((res,i)=>{ if(res.ok){ filesOk++; movedLocal(items[i].from,res.to,items[i].c); } }); }
  selected=new Set(); recomputeMatch(); saveCache(); renderAll();
  logUI(`user: moved ${n} track(s) to "${target.name}", files ${filesOk}/${items.length}${err?' ERROR '+err:''}`);
  return err&&!n?{ok:false,error:err}:{ok:true,n,filesOk};
}

  card.classList.remove('mini'); $('#pcFloatBtn').classList.remove('hidden');
  card.classList.toggle('floating',!!PL.float); document.body.classList.toggle('has-bar',!!PL.float&&!!PL.cur);
  card.classList.toggle('nocur',!PL.cur);
  $('#pcFloatBtn').textContent=PL.float?'⇱':'⇲'; $('#pcFloatBtn').title=PL.float?t.dockPlayer:t.floatPlayer;
  if(PL.float){ const home=$('#floatHome'); if(card.parentElement!==home) home.appendChild(card); }
  else { const home=$('#dockHome'); if(card.parentElement!==home) home.appendChild(card); }
}
async function toggleMini(){
  const t=T();
  if(PIP){ PIP.close(); return; }
  if(!('documentPictureInPicture' in window)){ toast(t.miniUnsupported,7000); return; }
  try{ PIP=await documentPictureInPicture.requestWindow({width:360,height:600}); }catch(e){ toast(t.miniUnsupported,7000); PIP=null; return; }

  // inline onclick="..." in the mini window runs there: give it the player functions
  ['togglePlay','prevTrack','nextTrack','toggleShuffle','cycleRepeat','togglePanel','toggleFloat','toggleMini','openKaraoke','jumpTo','reveal','seekLine','$','gid','savePlayer']

function togglePanel(k){ if(PL.float){ PL.panel=(PL.panel===k)?null:k; PL.tab=k; } else PL.tab=k; renderPlayer(); }

/* ============================== player ============================== */
// Queue = the track list on screen when you pressed play (same filter and order).
const PL={q:[],i:-1,shuffle:false,repeat:'off',cur:null,lyr:null,lyrLine:-1,tab:'lyrics',errors:0,float:false,panel:null};
try{ PL.float=localStorage.getItem('sunodlaa_float')==='1'; }catch(e){}
try{ const s=JSON.parse(localStorage.getItem('sunodlaa_player')||'{}'); PL.shuffle=!!s.shuffle; PL.repeat=s.repeat||'off'; PL.vol=s.vol??0.9; }catch(e){ PL.vol=0.9; }
function savePlayer(){ try{ localStorage.setItem('sunodlaa_player',JSON.stringify({shuffle:PL.shuffle,repeat:PL.repeat,vol:$('#audio').volume})); }catch(e){} }
function findClip(id){ for(const k in clipsByWs){ const c=(clipsByWs[k]||[]).find(x=>x.id===id); if(c) return c; } return null; }
function playable(c){ return !!(MATCH[c.id]||c.audio_url); }
function play(id){
  const list=(VIEW_LIST||[]).filter(playable), i=list.findIndex(c=>c.id===id);
  if(i>=0){ PL.q=list.map(c=>({k:'clip',id:c.id})); PL.i=i; } else { PL.q=[{k:'clip',id}]; PL.i=0; }
  if(PL.shuffle) shuffleRest();
  startCurrent();
}
function playLocal(i){
  PL.q=LOCAL_VIEW.map(f=>({k:'file',f})); PL.i=i; if(PL.shuffle) shuffleRest(); startCurrent();
}
function playAllView(shuffle){
  const list=(VIEW_LIST||[]).filter(playable); if(!list.length){ toast(T().nothingToPlay); return; }
  PL.q=list.map(c=>({k:'clip',id:c.id})); PL.i=0; PL.shuffle=!!shuffle; if(shuffle){ PL.i=Math.floor(Math.random()*PL.q.length); shuffleRest(); } savePlayer(); startCurrent();
}
function shuffleRest(){ const cur=PL.q[PL.i], rest=PL.q.filter((_,j)=>j!==PL.i); for(let j=rest.length-1;j>0;j--){ const k=Math.floor(Math.random()*(j+1)); [rest[j],rest[k]]=[rest[k],rest[j]]; } PL.q=[cur,...rest]; PL.i=0; }
function entryInfo(e){
  const t=T();
  if(!e) return null;
  if(e.k==='file'){ const name=e.f.p.split(/[\\/]/).pop().replace(/\.[^.]+$/,''); return {title:name,sub:e.f.w,src:e.f.p,local:true,path:e.f.p,img:'',clip:null}; }
  const c=findClip(e.id); if(!c) return null; const m=MATCH[c.id];
  return {title:c.title||'—',sub:[(CLIPWS[c.id]||{}).name,fmtDate(c.created_at,true)].filter(Boolean).join(' · '),
    src:m?('/api/play?path='+encodeURIComponent(m.p)):c.audio_url,local:!!m,path:m?m.p:'',img:c.image_large_url||c.image_url||'',clip:c};
}
function startCurrent(){
  const t=T(), e=PL.q[PL.i], info=entryInfo(e), a=$('#audio');
  if(!info){ return; }
  PL.cur=info; PL.lyr=null; PL.lyrLine=-1;
  a.src=info.local&&e.k==='file'?('/api/play?path='+encodeURIComponent(info.path)):info.src;
  a.volume=PL.vol; a.play().catch(()=>{});
  renderPlayer(); renderClips(); loadLyrics(info.clip); if(KV.open) openKaraoke();
  if('mediaSession' in navigator){ try{ navigator.mediaSession.metadata=new MediaMetadata({title:info.title,artist:info.sub,album:'SUNODLAA',artwork:info.img?[{src:info.img,sizes:'512x512',type:'image/jpeg'}]:[]}); }catch(x){} }
}
function nextTrack(auto){
  if(!PL.q.length) return;
  if(auto&&PL.repeat==='one'){ $('#audio').currentTime=0; $('#audio').play(); return; }
  if(PL.i<PL.q.length-1) PL.i++; else if(PL.repeat==='all'||!auto) PL.i=0; else { renderPlayer(); return; }
  startCurrent();
}
function prevTrack(){ const a=$('#audio'); if(a.currentTime>3){ a.currentTime=0; return; } if(PL.i>0){ PL.i--; startCurrent(); } else a.currentTime=0; }
function togglePlay(){ const a=$('#audio'); if(!PL.cur) { playAllView(false); return; } a.paused?a.play():a.pause(); }
function toggleShuffle(){ PL.shuffle=!PL.shuffle; if(PL.shuffle&&PL.q.length) shuffleRest(); savePlayer(); renderPlayer(); }
function cycleRepeat(){ PL.repeat={off:'all',all:'one',one:'off'}[PL.repeat]; savePlayer(); renderPlayer(); }
function jumpTo(j){ PL.i=j; startCurrent(); }
function setTab(k){ PL.tab=k; renderPlayer(); }
const REVEAL=[];
const REV_IDX={};
function revealBtn(p,label){ if(!p) return ''; if(REV_IDX[p]==null){ REV_IDX[p]=REVEAL.length; REVEAL.push(p); } return `<button class="small" title="${esc(p)}" onclick="event.stopPropagation();reveal(REVEAL[${REV_IDX[p]}])">📂${label?' '+esc(label):''}</button>`; }
async function reveal(p){ if(!p) return; const r=await api('/api/reveal?path='+encodeURIComponent(p)).catch(()=>({ok:false})); if(!r.ok) toast(T().revealFail); }
/* ============================== lyrics + karaoke ============================== */
// PL.lyr = { lines:[{t,s,e,sec,words:[{w,s,e}]}] }  (or {text} when Suno has no timings)
function buildLines(d){
  const words=d.aligned_words||[], lines=[];
  if(words.length){
    let cur=null;
    const push=()=>{ if(cur&&cur.words.length){ cur.t=cur.words.map(x=>x.w).join('').trim(); if(cur.t) lines.push(cur); } cur=null; };
    words.forEach(w=>{
      const parts=String(w.word||'').split('\n'), s=+w.start_s||0, e=+w.end_s||s;
      parts.forEach((part,i)=>{
        if(i>0) push();                      // a newline closes the line
        if(part.trim()){ if(!cur) cur={words:[],s,e}; cur.words.push({w:part,s,e}); cur.e=e; }
        else if(part&&cur) cur.words.push({w:part,s,e});
      });
    });
    push();
  } else {
    (d.aligned_lyrics||[]).forEach(l=>{ const t=String(l.text||'').trim(); if(t) lines.push({t,s:+l.start_s||0,e:+l.end_s||0,words:null}); });
  }
  lines.forEach(l=>{ l.sec=/^\s*\[[^\]]*\]\s*$/.test(l.t); });
  return lines.filter(l=>l.t);
}
async function loadLyrics(c){
  if(!c){ PL.lyr={none:true}; renderLyrics(); return; }
  const id=c.id; PL.lyr={loading:true}; renderLyrics();
  try{
    const d=await api('/api/lyrics?id='+id); if(!PL.cur||!PL.cur.clip||PL.cur.clip.id!==id) return;
    const lines=buildLines(d);
    PL.lyr=lines.some(l=>!l.sec)?{lines}:{text:c.prompt||''};
  }catch(e){ PL.lyr={text:c.prompt||''}; }
  renderLyrics();
}
function linesHtml(L,prefix){
  return L.lines.map((l,i)=>l.sec
    ?`<div class="ly sec" id="${prefix}${i}">${esc(l.t.replace(/[\[\]]/g,''))}</div>`
    :`<div class="ly" id="${prefix}${i}" onclick="seekLine(${i})">${l.words?l.words.map((w,j)=>`<span class="w" data-j="${j}">${esc(w.w)}</span>`).join(''):esc(l.t)}</div>`).join('');
}
function renderLyrics(){
  const t=T(), L=PL.lyr;
  const fill=(el,prefix)=>{ if(!el) return;
    if(!L||L.loading){ el.innerHTML='<div class="muted small-t">…</div>'; return; }
    if(L.none){ el.innerHTML='<div class="muted small-t">'+esc(t.noLyrics)+'</div>'; return; }
    if(L.lines) el.innerHTML=linesHtml(L,prefix);
    else el.innerHTML=L.text?'<div class="ly static">'+esc(L.text).replace(/\n/g,'<br>')+'</div>':'<div class="muted small-t">'+esc(t.noLyricsClip)+'</div>'; };
  fill($('#pcLyr'),'ly'); if(KV.open) fill($('#kLines'),'kl');
  PL.lyrLine=-1; LYV.forEach(v=>{ v.cur=-1; v.follow=true; v.btn&&v.btn.classList.add('hidden'); });
}
function seekLine(i){ const L=PL.lyr; if(!L||!L.lines||!L.lines[i]) return; $('#audio').currentTime=Math.max(0,L.lines[i].s-0.05); LYV.forEach(v=>{ v.follow=true; v.btn&&v.btn.classList.add('hidden'); }); if($('#audio').paused) $('#audio').play(); }

/* ---- follow the song; stop following when you scroll yourself, with a button to come back ---- */
const LYV=[];   // views: panel + karaoke
function lyrView(el,btn,prefix){
  const v={el,btn,prefix,follow:true,until:0,cur:-1}; LYV.push(v);
  const userMoved=()=>{ if(Date.now()<v.until) return; if(v.follow){ v.follow=false; btn.classList.remove('hidden'); } };
  el.addEventListener('wheel',()=>{ v.until=0; userMoved(); },{passive:true});
  el.addEventListener('touchmove',()=>{ v.until=0; userMoved(); },{passive:true});
  el.addEventListener('scroll',userMoved,{passive:true});
  btn.addEventListener('click',()=>{ v.follow=true; btn.classList.add('hidden'); centerLine(v,true); });
  return v;
}
function centerLine(v,instant){
  const n=v.el.querySelector('.ly.on'); if(!n) return;
  v.until=Date.now()+(instant?300:900);
  v.el.scrollTo({top:n.offsetTop-v.el.clientHeight/2+n.clientHeight/2,behavior:instant?'auto':'smooth'});
}
function lyrTick(c){
  const L=PL.lyr; if(!L||!L.lines) return;
  let k=-1; for(let i=0;i<L.lines.length;i++){ if(c>=L.lines[i].s-0.12) k=i; else break; }
  LYV.forEach(v=>{
    if(!v.el.isConnected||v.el.offsetParent===null&&!v.el.closest('.karaoke.show')) return;
    if(k!==v.cur){
      const o=v.el.querySelector('#'+v.prefix+v.cur); if(o){ o.classList.remove('on'); o.classList.add('past'); o.querySelectorAll('.w').forEach(w=>w.classList.add('sung')); }
      v.el.querySelectorAll('.ly').forEach((e,i)=>{ e.classList.toggle('past',i<k); if(i>=k) e.querySelectorAll('.w.sung').forEach(w=>w.classList.remove('sung')); });
      v.cur=k; const n=v.el.querySelector('#'+v.prefix+k); if(n) n.classList.add('on');
      if(v.follow) centerLine(v,false);
    }
    const line=L.lines[k]; if(line&&line.words){ const n=v.el.querySelector('#'+v.prefix+k);
      if(n) n.querySelectorAll('.w').forEach(w=>{ const wd=line.words[+w.dataset.j]; w.classList.toggle('sung',!!wd&&c>=wd.s-0.05); }); }
  });
}

/* ---- full-screen karaoke ---- */
const KV={open:false};
function openKaraoke(){
  const info=PL.cur; if(!info||!info.clip){ toast(T().noLyrics); return; }
  KV.open=true; $('#karaoke').classList.add('show');
  $('#kBg').style.backgroundImage=info.img?`url("${info.img}")`:'';
  $('#kTitle').textContent=info.title; $('#kSub').textContent=info.sub;
  renderLyrics(); renderKaraokeCtrl();
  setTimeout(()=>lyrTick($('#audio').currentTime||0),50);
}
function closeKaraoke(){ KV.open=false; $('#karaoke').classList.remove('show'); }
function renderKaraokeCtrl(){ const b=$('#kPlay'); if(b) b.textContent=$('#audio').paused?'▶':'⏸'; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&KV.open) closeKaraoke(); });

function renderPlayer(){
  const t=T(), card=$('#pcard'); if(!card) return;
  const info=PL.cur; applyFloat();
  $('#pcEmpty').classList.toggle('hidden',!!info); $('#pcBody').classList.toggle('hidden',!info);
  $('#pcHead').textContent=t.nowPlaying;
  $('#pcEmpty').innerHTML=`<div class="muted small-t">${esc(t.playerEmpty)}</div><div class="row" style="justify-content:center"><button class="small" onclick="playAllView(false)">▶ ${esc(t.playView)}</button><button class="small" onclick="playAllView(true)">🔀 ${esc(t.shuffleView)}</button></div>`;
  if(!info) return;
  $('#pcArt').style.backgroundImage=info.img?`url("${info.img}")`:'';
  $('#pcArt').classList.toggle('noimg',!info.img);
  $('#pcTitle').textContent=info.title; $('#pcSub').textContent=info.sub;
  $('#pcSrc').innerHTML=info.local?`<span class="src loc">💾 ${esc(t.localFile)}</span>`:`<span class="src cloud">☁ ${esc(t.sunoStream)}</span>`;
  $('#pcPath').innerHTML=info.path?`<span title="${esc(info.path)}">${esc(relPath(info.path))}</span> ${revealBtn(info.path,t.showInFolder)}`:`<span class="muted">${esc(t.notOnDisk)}</span>`;
  const a=$('#audio');
  $('#pcPlay').textContent=a.paused?'▶':'⏸';
  $('#pcShuf').classList.toggle('on',PL.shuffle); $('#pcShuf').title=t.shuffle;
  $('#pcRep').classList.toggle('on',PL.repeat!=='off'); $('#pcRep').textContent=PL.repeat==='one'?'🔂':'🔁'; $('#pcRep').title=t.repeat[PL.repeat];
  $('#pcVol').value=Math.round(a.volume*100);
  $('#pcTabL').classList.toggle('on',PL.tab==='lyrics'); $('#pcTabQ').classList.toggle('on',PL.tab==='queue');
  $('#pcTabL').textContent='🎤 '+t.lyrics; $('#pcTabQ').textContent='☰ '+t.upNext(Math.max(0,PL.q.length-PL.i-1));
  $('#pcLyr').classList.toggle('hidden',PL.tab!=='lyrics'); $('#pcQueue').classList.toggle('hidden',PL.tab!=='queue');
  $('#pcPanel').classList.toggle('open',!!PIP||!PL.float||!!PL.panel);
  if(PL.float){ $('#pcTabL').classList.toggle('on',PL.panel==='lyrics'); $('#pcTabQ').classList.toggle('on',PL.panel==='queue'); }
  if(PL.tab==='queue'){
    const rows=[]; for(let j=PL.i+1;j<Math.min(PL.q.length,PL.i+40);j++){ const x=entryInfo(PL.q[j]); if(x) rows.push(`<div class="qi" onclick="jumpTo(${j})"><span class="n">${j-PL.i}</span><div class="qt"><b>${esc(x.title)}</b><span>${esc(x.sub)}</span></div>${x.local?'💾':'☁'}</div>`); }
    $('#pcQueue').innerHTML=rows.join('')||'<div class="muted small-t">'+esc(t.queueEnd)+'</div>';
  }
}
function relPath(p){ const lib=(CFG.libraryPath||'').replace(/[\\/]+$/,''); return lib&&p.toLowerCase().startsWith(lib.toLowerCase())?'…'+p.slice(lib.length):p; }
function fmtT(s){ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
(function wirePlayer(){
  const a=$('#audio');
  a.addEventListener('timeupdate',()=>{
    const d=a.duration||0, c=a.currentTime||0;
    if(!PL.seeking){ $('#pcSeek').value=d?Math.round(1000*c/d):0; }
    $('#pcCur').textContent=fmtT(c); $('#pcDur').textContent=fmtT(d);
    $('#pcSeek').style.setProperty('--p',(d?100*c/d:0)+'%');
    lyrTick(c);
  });
  a.addEventListener('play',()=>{ PL.errors=0; renderPlayer(); renderKaraokeCtrl(); });
  a.addEventListener('pause',()=>{ renderPlayer(); renderKaraokeCtrl(); });
  lyrView($('#pcLyr'),$('#pcFollow'),'ly'); lyrView($('#kLines'),$('#kFollow'),'kl');
  a.addEventListener('ended',()=>nextTrack(true));
  a.addEventListener('error',()=>{ if(!PL.cur) return; PL.errors++; logUI('player: cannot play '+(PL.cur.path||PL.cur.src||'?'));
    toast(T().cantPlay(PL.cur.title)); if(PL.errors<5&&PL.i<PL.q.length-1) setTimeout(()=>nextTrack(false),800); });
  const sk=$('#pcSeek');
  sk.addEventListener('input',()=>{ PL.seeking=true; const d=a.duration||0; $('#pcCur').textContent=fmtT(d*sk.value/1000); sk.style.setProperty('--p',(sk.value/10)+'%'); });
  sk.addEventListener('change',()=>{ const d=a.duration||0; if(d) a.currentTime=d*sk.value/1000; PL.seeking=false; });
  $('#pcVol').addEventListener('input',e=>{ a.volume=e.target.value/100; PL.vol=a.volume; savePlayer(); });
  document.addEventListener('keydown',e=>{ if(e.target.matches('input,textarea,select')) return;
    if(e.code==='Space'&&PL.cur){ e.preventDefault(); togglePlay(); }
    else if(e.key==='ArrowRight'&&e.shiftKey) nextTrack(false); else if(e.key==='ArrowLeft'&&e.shiftKey) prevTrack(); });
  if('mediaSession' in navigator){ try{ navigator.mediaSession.setActionHandler('nexttrack',()=>nextTrack(false)); navigator.mediaSession.setActionHandler('previoustrack',prevTrack); }catch(x){} }
})();


/* ============================== backup ============================== */
function csvCell(v){ v=(v==null?'':''+v); return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function buildCsv(){
  const t=T(), rows=[[t.csv.ws,t.csv.title,t.csv.created,t.csv.dur,t.csv.onDisk,t.csv.how,t.csv.file,t.csv.id,t.csv.liked,t.csv.style]];
  workspaces.slice().sort((a,b)=>collator.compare(a.name,b.name)).forEach(w=>(clipsByWs[w.id]||[]).slice().sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||'')).forEach(c=>{
    const m=MATCH[c.id];
    rows.push([w.name,c.title,(c.created_at||'').replace('T',' ').slice(0,16),fmtDur(c.duration),m?t.yes:t.no,m?(m.k==='id'?'id':'title'):'',m?m.p:'',c.id,c.is_liked?t.yes:'',c.tags]);
  }));
  for(const k in LOCAL_ONLY) LOCAL_ONLY[k].forEach(f=>rows.push([f.w,(f.t||f.ft),'','',t.yes,t.csv.localOnly,f.p,f.id||'','','']));
  return rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
}
async function doBackup(){
  const t=T(); toast(t.backupRunning,20000);
  const r=await post('/api/backup',{csv:buildCsv()}).catch(e=>({ok:false,error:''+e}));
  logUI('user: backup -> '+(r.ok?r.path:'failed '+r.error));
  if(r.ok){ LAST_BACKUP=r.path; showNotice(t.backupDone(r.path,r.csv,Math.round(r.size/1024)),r.path); renderBackupInfo(); } else toast(t.backupFail(r.error||''),8000);
}
function doRestore(){ pickRestore(); }
let LAST_BACKUP=null;
async function renderBackupInfo(){
  const el=$('#backupInfo'); if(!el) return; const t=T();
  const r=await api('/api/backup/info').catch(()=>null); if(!r) return;
  el.innerHTML=`<div>${esc(t.cacheWhere)} <code>${esc(r.cacheDir)}</code> ${revealBtn(r.cacheDir)}</div>`+
    `<div>${esc(t.backupWhere)} <code>${esc(r.dir)}</code></div>`+
    `<div>${r.last?esc(t.lastBackup(fmtDate(r.lastAt,true)))+` <code>${esc(r.last.split(/[\\/]/).pop())}</code> ${revealBtn(r.last)}`:esc(t.noBackup)}</div>`;
}
function showNotice(msg,path){
  const n=$('#notice'); n.innerHTML=`<div>${esc(msg)}</div><div class="row">${revealBtn(path,T().showInFolder)}<button class="small" onclick="$('#notice').classList.add('hidden')">OK</button></div>`;
  n.classList.remove('hidden'); $('#toast').style.display='none';
}
