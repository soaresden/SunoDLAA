<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNODLAA</title>
<link rel="icon" href="assets/logo.png">
<style>
  :root{
    --fuchsia:#E81E8C; --turq:#009B8E; --yellow:#FFC531; --orange:#F57C00; --cobalt:#2B6BFF;
    --bg:#FFF9FC; --bg2:#FBEAF3; --card:#fff; --ink:#1B1B1F; --muted:#7A6B75; --border:#EBD5E4;
    --gold:#E3B341; --ok:#0A9A5B; --warn:#F57C00; --bad:#D32F4B;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  button,select,input,textarea{font:inherit}
  button{cursor:pointer;border:none;border-radius:10px;padding:8px 14px;background:var(--bg2);color:var(--ink)}
  button:hover:not(:disabled){filter:brightness(1.04)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:linear-gradient(90deg,var(--fuchsia),var(--orange));color:#fff;font-weight:700}
  button.go{background:linear-gradient(90deg,var(--turq),var(--cobalt));color:#fff;font-weight:800}
  button.big{font-size:16px;padding:12px 22px;border-radius:14px}
  button.small{padding:5px 10px;font-size:12px}
  input[type=text],textarea,select{background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:8px}
  .hidden{display:none!important}
  .muted{color:var(--muted)} .small-t{font-size:12px}

  header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  header img{height:38px;width:38px;border-radius:50%}
  .brand{display:flex;flex-direction:column;line-height:1.1}
  .brand b{font-size:16px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--fuchsia),var(--orange),var(--turq),var(--cobalt));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand span{font-size:11px;color:var(--muted)}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
  .chip.ok{background:#E3F6EE;color:var(--ok)} .chip.pro{background:linear-gradient(90deg,#FFE9A8,#FFD0E6);color:#7A4A00;font-weight:700} .chip.bad{background:#FDE3E8;color:var(--bad)}
  .spacer{flex:1}

  /* ---------- setup wizard ---------- */
  #setup{max-width:860px;margin:28px auto;padding:0 16px 60px}
  #setup h1{margin:0 0 4px;font-size:24px}
  .step{display:flex;gap:16px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:16px;transition:opacity .2s}
  .step.locked{opacity:.45;pointer-events:none}
  .step.current{border:2px solid var(--fuchsia);box-shadow:0 8px 28px rgba(232,30,140,.12)}
  .step .num{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--fuchsia),var(--orange))}
  .step.done .num{background:var(--ok)}
  .step .body{flex:1;min-width:0}
  .step h3{margin:6px 0 4px;font-size:17px}
  .step p{margin:4px 0 12px;color:var(--muted)}
  .status{margin-top:10px;font-size:13px;min-height:18px}
  .status.ok{color:var(--ok);font-weight:600} .status.bad{color:var(--bad)}
  .pathbox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg2);font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
  details{margin-top:12px} summary{cursor:pointer;color:var(--muted);font-size:13px}
  .helpsteps{margin:8px 0 0 18px;padding:0} .helpsteps li{margin:4px 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .row input[type=text]{flex:1;min-width:220px}
  .presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
  .preset{border:2px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;background:#fff}
  .preset.sel{border-color:var(--fuchsia);background:#FFF3F9}
  .preset b{display:block;margin-bottom:6px}
  .preset code{font-size:12px;color:var(--muted);word-break:break-all}
  .formats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .formats label{border:2px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;flex:1;min-width:220px;background:#fff}
  .formats label.sel{border-color:var(--turq);background:#EFFCFA}
  .preview{margin-top:14px;padding:12px;border-radius:12px;background:#1B1B1F;color:#fff;font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
  .preview .dim{color:#A99BA5}
  .finish{text-align:center;margin-top:24px}

  /* ---------- library ---------- */
  #library{display:flex;flex-direction:column;height:calc(100vh - 55px)}
  .banner{margin:10px 16px 0;padding:10px 14px;border-radius:12px;background:#FFF4E0;color:#7A4A00;border:1px solid #FFD699}
  .hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:12px 16px 0;padding:16px 18px;border-radius:18px;background:#fff;border:1px solid var(--border)}
  .stats{display:flex;gap:18px;flex-wrap:wrap;flex:1}
  .stat b{display:block;font-size:22px} .stat span{font-size:12px;color:var(--muted)}
  .stat.miss b{color:var(--orange)} .stat.have b{color:var(--ok)}
  .analyzing{flex-basis:100%;font-size:12px;color:var(--muted)}
  .bar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fuchsia),var(--orange));transition:width .3s}
  .cols{flex:1;display:grid;grid-template-columns:290px 1fr 320px;min-height:0;margin-top:12px;border-top:1px solid var(--border)}
  .col{overflow:auto;padding:10px}
  .col.ws{border-right:1px solid var(--border)} .col.job{border-left:1px solid var(--border);background:#fff}
  .ptitle{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 4px 8px;font-weight:700}
  .ws-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}
  .ws-item:hover{background:var(--bg2)} .ws-item.active{background:var(--bg2);outline:2px solid var(--fuchsia)}
  .ws-item img,.ws-item .ph{width:42px;height:42px;border-radius:10px;object-fit:cover;background:linear-gradient(135deg,var(--fuchsia),var(--turq));flex:none}
  .ws-item .meta{min-width:0;flex:1} .ws-item .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
  .badge.full{background:#E3F6EE;color:var(--ok)} .badge.part{background:#FFF1DE;color:var(--orange)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .toolbar input{flex:1;min-width:140px}
  .clip{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:12px}
  .clip:hover{background:var(--bg2)}
  .clip.orig{background:linear-gradient(90deg,rgba(255,197,49,.28),transparent);outline:1px solid var(--gold)}
  .clip img,.clip .ph{width:40px;height:40px;border-radius:8px;object-fit:cover;background:linear-gradient(135deg,var(--orange),var(--fuchsia));flex:none}
  .clip .t{min-width:0;flex:1} .clip .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .clip .title .star{color:var(--gold)} .clip .tags{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clip input{width:18px;height:18px;accent-color:var(--fuchsia)}
  .avail{width:22px;text-align:center;flex:none}
  .empty{color:var(--muted);text-align:center;padding:36px 10px}
  .jobbox{border-radius:14px;padding:12px;background:var(--bg2)}
  .jobbox .now{font-weight:700;margin:6px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .counts{display:flex;gap:12px;font-size:12px;margin-top:8px;flex-wrap:wrap}
  .counts .c-ok{color:var(--ok)} .counts .c-bad{color:var(--bad)} .counts .c-skip{color:var(--muted)}
  .fail{font-size:12px;padding:6px 8px;border-radius:8px;background:#FDE3E8;margin-top:6px}
  .fail b{display:block}
  .player{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:8px 16px;display:none;align-items:center;gap:12px;z-index:30}
  .player.show{display:flex} .player .pt{flex:1;min-width:0} .player .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .karaoke{position:fixed;inset:0;background:rgba(255,249,252,.97);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
  .karaoke.show{display:flex} .karaoke .line{font-size:26px;line-height:1.7;max-width:800px;color:var(--muted)}
  .karaoke .w.on{color:var(--fuchsia);font-weight:700} .karaoke .close{position:absolute;top:16px;right:20px}
  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;display:none;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .stat.loc b{color:var(--cobalt)}
  .syncrow{display:flex;gap:18px;flex-wrap:wrap}
  .wstools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 4px 8px}
  .wstools input[type=text]{flex:1;min-width:120px;padding:6px 8px}
  .wstools select{padding:6px}
  .chk{display:flex;align-items:center;gap:4px;cursor:pointer}
  .ws-item .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ws-item.all .ph{background:linear-gradient(135deg,var(--turq),var(--cobalt));display:grid;place-items:center;color:#fff;font-size:20px}
  .ws-item.orph .ph{background:linear-gradient(135deg,var(--cobalt),var(--muted));display:grid;place-items:center;color:#fff;font-size:20px}
  .ws-sep{height:1px;background:var(--border);margin:6px 4px}
  .badge.loc{background:#E6EEFF;color:var(--cobalt)}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{padding:5px 10px;font-size:12px;border-radius:999px}
  .seg button.on{background:var(--ink);color:#fff}
  .wshead{display:flex;gap:12px;align-items:center;margin:2px 0 10px}
  .wshead img,.wshead .ph{width:52px;height:52px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,var(--fuchsia),var(--turq));flex:none}
  .wshead h2{margin:0;font-size:18px}
  .clip .sub2{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clip .sub2 .ws{color:var(--cobalt);font-weight:600}
  .clip .heart{color:var(--fuchsia)}
  .more{text-align:center;margin:10px}
  .localonly{margin-top:16px;border-top:1px dashed var(--border);padding-top:8px}
  .localonly summary{font-weight:700;color:var(--cobalt)}
  .lfile{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:10px;font-size:13px}
  .lfile:hover{background:var(--bg2)} .lfile .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lfile .dir{color:var(--muted);font-size:11px}
  @media (max-width:1000px){ .cols{grid-template-columns:1fr} .col.ws,.col.job{border:none} }
</style>
</head>
<body>
<header>
  <img src="assets/logo.png" alt="">
  <div class="brand"><b>SUNODLAA</b><span>SunoAAWeb</span></div>
  <span id="acctChip" class="chip hidden"></span>
  <span class="spacer"></span>
  <button class="small hidden" id="btnLibrary" onclick="openLibrary()"></button>
  <button class="small" id="btnSetup" onclick="showSetup()"></button>
</header>

<!-- ======================= SETUP / WIZARD ======================= -->
<section id="setup" class="hidden">
  <div class="row" style="justify-content:space-between;margin-top:0">
    <div>
      <h1 id="sTitle"></h1>
      <div class="muted" id="sIntro"></div>
    </div>
    <label class="small-t muted"><span id="sLangLbl"></span>
      <select id="langSel" onchange="setLang(this.value)"><option value="en">English</option><option value="fr">Français</option></select>
    </label>
  </div>

  <div class="step" id="step1">
    <div class="num">1</div>
    <div class="body">
      <h3 id="s1Title"></h3>
      <p id="s1Text"></p>
      <button class="primary big" id="btnConnect" onclick="doLogin()"></button>
      <div class="status" id="s1Status"></div>
      <details id="s1Help">
        <summary id="s1HelpSum"></summary>
        <ol class="helpsteps" id="s1HelpSteps"></ol>
        <div class="row"><input type="text" id="cookieInput" placeholder="__client = …"><button id="btnCookie" onclick="saveCookie()"></button></div>
      </details>
    </div>
  </div>

  <div class="step" id="step2">
    <div class="num">2</div>
    <div class="body">
      <h3 id="s2Title"></h3>
      <p id="s2Text"></p>
      <button class="primary big" id="btnPick" onclick="pickFolder()"></button>
      <div class="pathbox hidden" id="libPath"></div>
      <div class="status" id="s2Status"></div>
      <details id="s2Type">
        <summary id="s2TypeSum"></summary>
        <div class="row"><input type="text" id="libInput" placeholder="P:\Music"><button id="btnLibOk" onclick="saveLibPath()">OK</button></div>
      </details>
    </div>
  </div>

  <div class="step" id="step3">
    <div class="num">3</div>
    <div class="body">
      <h3 id="s3Title"></h3>
      <p id="s3Text"></p>
      <div class="presets" id="presets"></div>
      <div id="customBox" class="hidden">
        <div class="row"><span class="small-t muted" style="width:120px" id="lblFolderPat"></span><input type="text" id="folderPat" oninput="customChanged()"></div>
        <div class="row"><span class="small-t muted" style="width:120px" id="lblFilePat"></span><input type="text" id="filePat" oninput="customChanged()"></div>
        <div class="small-t muted" style="margin-top:6px" id="tokensHelp"></div>
      </div>
      <div style="margin-top:14px;font-weight:700" id="lblQuality"></div>
      <div class="formats" id="formats"></div>
      <label class="small-t" style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;cursor:pointer"><input type="checkbox" id="lrcBox" style="margin-top:2px" onchange="saveOpts({saveLrc:this.checked})"><span id="lblLrc" style="flex:1"></span></label>
      <div class="preview" id="preview"></div>
    </div>
  </div>

  <details id="advanced" style="margin-top:18px">
    <summary id="advSum"></summary>
    <div class="step" style="margin-top:10px"><div class="body">
      <div class="row"><span id="lblDelay"></span><input type="text" id="delayInput" style="max-width:70px" onchange="saveOpts({downloadDelaySec:+this.value||0})"><span class="muted small-t" id="lblDelayHint"></span></div>
      <div class="row"><button id="btnRenameFolders" onclick="applyFolders()"></button><span class="muted small-t" id="lblRenameHint"></span></div>
    </div></div>
  </details>

  <div class="finish"><button class="go big" id="btnFinish" onclick="openLibrary()"></button></div>
</section>

<!-- ======================= LIBRARY ======================= -->
<section id="library" class="hidden">
  <div class="banner hidden" id="freeBanner"></div>
  <div class="hero">
    <div class="stats">
      <div class="stat"><b id="nTracks">–</b><span id="lTracks"></span></div>
      <div class="stat"><b id="nWs">–</b><span id="lWs"></span></div>
      <div class="stat have"><b id="nHave">–</b><span id="lHave"></span></div>
      <div class="stat miss"><b id="nMiss">–</b><span id="lMiss"></span></div>
      <div class="stat loc"><b id="nLocal">–</b><span id="lLocal"></span></div>
    </div>
    <button class="go big" id="btnEverything" onclick="downloadEverything()"></button>
    <button class="small" id="btnRecheck" onclick="refreshAll()"></button>
    <div class="analyzing" id="syncBox">
      <div class="syncrow"><span id="syncSuno"></span><span id="syncDisk"></span></div>
      <div class="bar hidden" id="syncBarBox"><i id="syncBar"></i></div>
    </div>
  </div>
  <div class="cols">
    <div class="col ws">
      <div class="ptitle" id="tWs"></div>
      <div class="wstools">
        <input type="text" id="wsSearch" oninput="F.wsQ=this.value;renderWorkspaces()">
        <select id="wsSort" onchange="F.wsSort=this.value;savePrefs();renderWorkspaces()"></select>
        <label class="small-t muted chk"><input type="checkbox" id="wsIncomplete" onchange="F.incomplete=this.checked;savePrefs();renderWorkspaces()"> <span id="lblIncomplete"></span></label>
      </div>
      <div id="wsList"></div>
    </div>
    <div class="col">
      <div id="wsHead"></div>
      <div class="toolbar">
        <input type="text" id="search" oninput="F.limit=300;renderClips()">
        <select id="sortSel" onchange="F.sort=this.value;savePrefs();renderClips()"></select>
      </div>
      <div class="toolbar">
        <div class="seg" id="filterSeg"></div>
        <span class="spacer"></span>
        <button class="small" id="btnWsMissing" onclick="downloadViewMissing()"></button>
        <button class="small" id="btnSelected" onclick="downloadSelected()"></button>
      </div>
      <div id="clipList"></div>
    </div>
    <div class="col job">
      <div class="ptitle" id="tJob"></div>
      <div id="jobIdle" class="empty"></div>
      <div id="jobBox" class="jobbox hidden">
        <div class="small-t muted" id="jobStep"></div>
        <div class="now" id="jobNow"></div>
        <div class="bar"><i id="jobBar"></i></div>
        <div class="counts"><span class="c-ok" id="cOk"></span><span class="c-bad" id="cBad"></span><span class="c-skip" id="cSkip"></span></div>
        <div class="row"><button class="small" id="btnStop" onclick="stopJob()"></button></div>
      </div>
      <div id="failList"></div>
    </div>
  </div>
</section>

<div class="player" id="player">
  <div class="pt"><div class="n" id="pName">—</div><div class="muted small-t" id="pSub"></div></div>
  <button class="small" onclick="openKaraoke()">🎤 <span id="lblLyrics"></span></button>
  <audio id="audio" controls></audio>
</div>
<div class="karaoke" id="karaoke"><button class="close" onclick="closeKaraoke()">✕</button><div class="line" id="karaokeLine">…</div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================== i18n ============================== */
const I18N = {
  en: {
    setup:"⚙️ Setup", library:"📚 My library",
    sTitle:"Let's set up SunoAAWeb", sIntro:"Three steps, about a minute. You can come back here any time with ⚙️ Setup.", lang:"Language",

    s1Text:"Click the button: a separate browser window opens on suno.com. Sign in there once (Google, Discord, e-mail…) — it's a separate window, so it doesn't know your usual session yet. As soon as you're in, SunoAAWeb notices it by itself and remembers it for next time.",
    connect:"🔑 Connect to Suno", reconnect:"🔑 Reconnect",

    pick:"📁 Choose a folder…", pickOther:"📁 Choose another folder…", pickFailed:"The folder window could not open here — type the path instead.",
    s2TypeSum:"Type the path instead", folderMissing:"This folder doesn't exist.",
    s3Title:"How should files be named?", s3Text:"Pick a style. The preview at the bottom shows exactly what you'll get.",
    presetMM:"MediaMonkey style", presetMMd:"One folder per workspace, numbered tracks.",
    presetSimple:"Simple", presetSimpled:"One folder per workspace, title only.",
    presetCustom:"Custom", presetCustomd:"Your own folder and file masks.",
    folderPat:"Folder", filePat:"File",
    tokens:"Tags: <Disc#:2> <Track#:3> <Title> <Artist> <Album> <Year> <Genre> <ID8> — French names work too (<Disque n°:2> <Piste n°:3> <Titre>). The number after “:” is the number of digits. Folder: {workspace}. Track numbers follow the workspace's creation order (oldest = 001).",

    advSum:"Advanced", delay:"Pause between downloads", delayHint:"seconds — keeps Suno from blocking you on big downloads",

async function loadAccount(){ ACC=await api('/api/account').catch(()=>null); renderAccount(); renderSetup(); }
function renderAccount(){
  const c=$('#acctChip'), t=T(); c.classList.remove('hidden');
  if(!AUTH.ok){ c.className='chip bad'; c.textContent=t.notConnected; $('#freeBanner').classList.add('hidden'); return; }
  const parts=[ACC&&ACC.label?ACC.label:t.connectedChip];
  if(ACC&&ACC.ok){ parts.push(ACC.pro?'Pro ★':'Free'); if(ACC.credits!=null) parts.push(t.credits(ACC.credits)); }
  c.textContent=parts.join(' · '); c.className='chip '+(ACC&&ACC.pro?'pro':'ok');

}

function showSetup(){ $('#setup').classList.remove('hidden'); $('#library').classList.add('hidden'); $('#btnSetup').classList.add('hidden'); $('#btnLibrary').classList.toggle('hidden',!(AUTH.ok&&CFG.libraryExists)); renderSetup(); }
function presetOf(){
  if(CFG.folderPattern===PRESETS.mm.folder && (CFG.fileNamePattern===PRESETS.mm.file||CFG.fileNamePattern===MM_FR)) return 'mm';
  if(CFG.folderPattern===PRESETS.simple.folder && CFG.fileNamePattern===PRESETS.simple.file) return 'simple';
  return 'custom';
}
function renderSetup(){
  const t=T(); if(!CFG || !$('#step1')) return;
  const s1=!!AUTH.ok, s2=!!CFG.libraryExists;
  const cls=(el,done,current,locked)=>{ el.classList.toggle('done',done); el.classList.toggle('current',current); el.classList.toggle('locked',locked); };
  cls($('#step1'),s1,!s1,false); cls($('#step2'),s2,s1&&!s2,!s1); cls($('#step3'),false,s1&&s2,!(s1&&s2));
  $('#step1 .num').textContent=s1?'✓':'1'; $('#step2 .num').textContent=s2?'✓':'2';
  $('#btnConnect').textContent=s1?t.reconnect:t.connect;
  if(s1 && !$('#s1Status').dataset.live){ $('#s1Status').className='status ok'; $('#s1Status').textContent=t.connectedAs(ACC&&ACC.label); }
  $('#btnPick').textContent=s2?t.pickOther:t.pick;
  $('#libPath').classList.toggle('hidden',!s2); $('#libPath').textContent=CFG.libraryPath||'';
  const cur=customMode?'custom':presetOf();
  const mmFile=LANG==='fr'?MM_FR:PRESETS.mm.file;
  const P=[['mm',t.presetMM,t.presetMMd,PRESETS.mm.folder+'\\'+mmFile],['simple',t.presetSimple,t.presetSimpled,PRESETS.simple.folder+'\\'+PRESETS.simple.file],['custom',t.presetCustom,t.presetCustomd,'']];
  $('#presets').innerHTML=P.map(([k,n,d,c])=>`<div class="preset ${cur===k?'sel':''}" onclick="choosePreset('${k}')"><b>${esc(n)}</b><div class="small-t muted">${esc(d)}</div>${c?`<code>${esc(c)}</code>`:''}</div>`).join('');
  $('#customBox').classList.toggle('hidden',cur!=='custom');
  if(document.activeElement!==$('#folderPat')) $('#folderPat').value=CFG.folderPattern||'';
  if(document.activeElement!==$('#filePat')) $('#filePat').value=CFG.fileNamePattern||'';
  const fmt=CFG.audioFormat||'mp3';
  $('#formats').innerHTML=[['mp3',t.mp3,t.mp3d],['wav',t.wav,t.wavd]].map(([k,n,d])=>`<label class="${fmt===k?'sel':''}"><input type="radio" name="fmt" ${fmt===k?'checked':''} onchange="saveOpts({audioFormat:'${k}'})"> <b>${esc(n)}</b><div class="small-t muted">${esc(d)}</div></label>`).join('');
  $('#lrcBox').checked=CFG.saveLrc!==false;
  if(document.activeElement!==$('#delayInput')) $('#delayInput').value=CFG.downloadDelaySec??3;
  const lib=(CFG.libraryPath||'…').replace(/[\\/]+$/,''), fe=CFG.fileExample||'', fo=CFG.folderExample||'';
  $('#preview').innerHTML=`<span class="dim">${esc(t.preview)} :</span><br>${esc(lib)}\\${esc(fo)}\\<b>${esc(fe)}</b>`+(CFG.saveLrc!==false?`<br><span class="dim">${esc(lib)}\\${esc(fo)}\\${esc(fe.replace(/\.[^.]+$/,'.lrc'))}</span>`:'');
  const ready=s1&&s2; $('#btnFinish').disabled=!ready; $('#btnFinish').textContent=ready?t.finish:t.finishNeed;
}
async function saveOpts(o){ CFG=await post('/api/config',o); renderSetup(); }
function choosePreset(k){
  customMode=(k==='custom');
  if(k==='mm') saveOpts({folderPattern:PRESETS.mm.folder,fileNamePattern:LANG==='fr'?MM_FR:PRESETS.mm.file});
  else if(k==='simple') saveOpts(PRESETS.simple.folder?{folderPattern:PRESETS.simple.folder,fileNamePattern:PRESETS.simple.file}:{});
  else renderSetup();
}

let loginPoll=null;
async function doLogin(){
  const t=T(), st=$('#s1Status'); st.dataset.live='1'; st.className='status'; st.textContent=t.opening;
  const r=await post('/api/login/start').catch(()=>({ok:false}));
  if(!r.ok){ st.className='status bad'; st.textContent=t.noBrowser; $('#s1Help').open=true; return; }
  st.textContent=t.waiting;
  clearInterval(loginPoll); let n=0;
  const tick=async()=>{
    n++; const T2=T();
    if(n>120){ clearInterval(loginPoll); st.className='status bad'; st.textContent=T2.timedOut; $('#s1Help').open=true; return; }
    const c=await api('/api/login/check').catch(()=>({}));
    if(c.ok){ clearInterval(loginPoll); await afterAuth(); return; }
    if(c.code==='window_closed'){ clearInterval(loginPoll); st.className='status bad'; st.textContent=T2.windowClosed; return; }
    if(c.code==='session_invalid'){ st.className='status bad'; st.textContent=T2.sessionInvalid+(c.detail?'  ['+c.detail+']':''); return; }
    st.className='status'; st.textContent=T2.notSignedIn;
  };
  setTimeout(tick,1500); loginPoll=setInterval(tick,2500);
}
async function saveCookie(){
  const v=$('#cookieInput').value.trim().replace(/^__client=/,''); if(!v) return;
  await post('/api/config',{clientCookie:v}); AUTH=await api('/api/auth');
  if(AUTH.ok){ $('#cookieInput').value=''; await afterAuth(); } else { $('#s1Status').className='status bad'; $('#s1Status').textContent=T().cookieBad; }
}
async function afterAuth(){ AUTH=await api('/api/auth'); delete $('#s1Status').dataset.live; CFG=await api('/api/config'); await loadAccount(); renderSetup(); renderAccount(); }
async function pickFolder(){

  if(r.ok){ CFG=await api('/api/config'); st.textContent=''; LOCAL=[]; libLoaded=false; }
  else if(r.cancelled){ st.textContent=''; }
  else { st.className='status bad'; st.textContent=T().pickFailed; $('#s2Type').open=true; }
  renderSetup();
}

/* ============================== library ============================== */
// Suno side comes from cache\library.json first (instant), then only the workspaces
// that changed on Suno are fetched again. Disk side comes from the background scan.
const ALL_ID='*', ORPH_ID='?';
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const collator=new Intl.Collator(undefined,{sensitivity:'base',numeric:true});
function logUI(m){ post('/api/log',{msg:m}).catch(()=>{}); }
function locale(){ return LANG==='fr'?'fr-FR':'en-GB'; }
function fmtDate(iso,time){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return '';
  return d.toLocaleDateString(locale(),{day:'numeric',month:'short',year:'numeric'})+(time?' '+d.toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'}):''); }
function fmtMonth(iso){ if(!iso) return ''; const d=new Date(iso); return isNaN(d)?'':d.toLocaleDateString(locale(),{month:'short',year:'numeric'}); }
function fmtDur(s){ s=Math.round(+s||0); if(!s) return ''; return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function ago(iso){ if(!iso) return ''; const rtf=new Intl.RelativeTimeFormat(LANG,{numeric:'auto'}); const s=(new Date(iso)-Date.now())/1000;
  for(const [u,v] of [['year',31536000],['month',2592000],['day',86400],['hour',3600],['minute',60]]) if(Math.abs(s)>=v) return rtf.format(Math.round(s/v),u);
  return rtf.format(0,'minute'); }
function slim(c){ const m=c.metadata||{}; return {id:c.id,title:c.title||'',created_at:c.created_at||'',duration:m.duration||c.duration||0,tags:m.tags||'',prompt:m.prompt||'',
  cover:m.cover_clip_id||'',image_url:c.image_url||'',image_large_url:c.image_large_url||'',audio_url:c.audio_url||'',is_liked:!!c.is_liked,display_name:c.display_name||''}; }
function slimWs(w){ return {id:w.id,name:w.name||'',image_url:w.image_url||'',clip_count:w.clip_count||0,marker:JSON.stringify(w.last_updated_clip??null)+'|'+(w.clip_count||0)}; }
function wsById(id){ return workspaces.find(w=>w.id===id); }
function nClips(){ let n=0; for(const k in clipsByWs) n+=(clipsByWs[k]||[]).length; return n; }
function savePrefs(){ try{ localStorage.setItem('sunodlaa_view',JSON.stringify({sort:F.sort,wsSort:F.wsSort,incomplete:F.incomplete,filter:F.filter})); }catch(e){} }
try{ Object.assign(F,JSON.parse(localStorage.getItem('sunodlaa_view')||'{}')); }catch(e){}

async function loadCache(){
  const d=await api('/api/cache/library').catch(()=>({}));
  if(d && d.v===2 && Array.isArray(d.workspaces)){
    workspaces=d.workspaces; clipsByWs=d.clips||{}; wsMarker=d.markers||{}; syncedAt=d.savedAt||null;
    logUI(`library cache loaded: ${workspaces.length} workspaces, ${nClips()} tracks (saved ${d.savedAt})`);
  } else logUI('no library cache yet: first full load from Suno');
  recomputeMatch();
}
let saveT=null;
function saveCache(now){
  clearTimeout(saveT);
  const go=()=>post('/api/cache/library',{v:2,savedAt:syncedAt||new Date().toISOString(),account:(ACC&&ACC.label)||'',workspaces,clips:clipsByWs,markers:wsMarker}).catch(()=>{});
  if(now) return go(); saveT=setTimeout(go,1500);
}
async function fetchClips(ws){
  const out=[]; let page=1;
  while(true){
    const d=await api('/api/suno?path=/api/project/'+ws.id+'&page='+page);
    if(d.error) throw new Error(d.error);
    const pc=d.project_clips||[]; pc.forEach(x=>{ if(x.clip) out.push(slim(x.clip)); });
    if(pc.length<20) break; page++;
  }
  return out;
}
async function syncSuno(force){
  if(syncing) return; syncing=true; syncErr=null; const t0=Date.now(); let fetched=0, errors=0;
  syncProg={i:0,n:0}; renderSync();
  try{
    const list=[]; let page=1,total=null;
    while(true){
      const d=await api('/api/suno?path=/api/project/me&page='+page);
      if(d.error) throw new Error(d.error);
      const items=d.projects||[]; list.push(...items); total=d.num_total_results??total;
      if(!items.length||(total!=null&&list.length>=total)) break; page++;
    }
    const fresh=list.map(slimWs), ids=new Set(fresh.map(w=>w.id));
    Object.keys(clipsByWs).forEach(k=>{ if(!ids.has(k)){ delete clipsByWs[k]; delete wsMarker[k]; } });
    workspaces=fresh;
    const todo=fresh.filter(w=>force||!clipsByWs[w.id]||wsMarker[w.id]!==w.marker);
    // the workspace on screen first
    todo.sort((a,b)=>(b.id===currentWs)-(a.id===currentWs));
    syncProg={i:0,n:todo.length}; recomputeMatch(); renderAll();
    for(const w of todo){
      try{ clipsByWs[w.id]=await fetchClips(w); wsMarker[w.id]=w.marker; fetched++; }
      catch(e){ errors++; logUI(`suno: workspace "${w.name}" failed: ${e.message||e}`); }
      syncProg.i++;
      if(syncProg.i%5===0||w.id===currentWs){ recomputeMatch(); renderAll(); } else renderSync();
      if(syncProg.i%25===0) saveCache();
    }
    syncedAt=new Date().toISOString(); await saveCache(true);
    logUI(`suno sync done: ${fresh.length} workspaces, ${todo.length} changed, ${fetched} fetched, ${errors} errors, ${nClips()} tracks, ${Math.round((Date.now()-t0)/1000)} s`);
  }catch(e){ syncErr=''+(e.message||e); logUI('suno sync ERROR: '+syncErr); }
  syncing=false; syncProg=null; recomputeMatch(); renderAll(); logMatch();
}

/* ---- disk ---- */
async function startDiskScan(){
  const prev=await api('/api/scan/result').catch(()=>null); applyScan(prev,false);
  const s=await post('/api/scan/start').catch(()=>({}));
  if(!s.ok){ logUI('disk scan not started: '+JSON.stringify(s)); return; }
  scanProg={done:0,total:0}; renderSync();
  const poll=async()=>{
    const st=await api('/api/scan/status').catch(()=>null);
    if(st&&st.running){ scanProg={done:st.done,total:st.total}; renderSync(); setTimeout(poll,1000); return; }
    scanProg=null; scanErr=st&&st.error;
    const r=await api('/api/scan/result').catch(()=>null); applyScan(r,true); renderAll(); logMatch();
  };
  setTimeout(poll,600);
}
function applyScan(r,fresh){
  if(!r) return; const files=r.files||(r.index&&r.index.files)||[];
  if(!fresh && !files.length) return;
  LOCAL=files; scannedAt=fresh?new Date().toISOString():((r.index&&r.index.scannedAt)||null);
  recomputeMatch(); renderAll();
}
function trackNo(p){ const b=(p||'').split(/[\\/]/).pop(); const m=b.match(/^\s*(\d+)(?:[-_ .]+(\d+))?/); return m?+(m[2]||m[1]):null; }
// Link Suno tracks to files: 1) Suno id in the tags (TSRC/TXXX/COMM) or (id8) in the name,
// 2) same title inside the same workspace folder (files without any id only).
function recomputeMatch(){
  MATCH={}; LOCAL_ONLY={}; CLIPWS={};
  const used=new Set(), byId={}, byId8={};
  LOCAL.forEach((f,i)=>{ if(f.id) byId[f.id]=i; else if(f.id8) (byId8[f.id8]=byId8[f.id8]||[]).push(i); });
  for(const w of workspaces) for(const c of (clipsByWs[w.id]||[])){
    CLIPWS[c.id]=w;
    let i=byId[c.id]; if(i==null){ const a=byId8[c.id.slice(0,8)]; if(a&&a.length===1) i=a[0]; }
    if(i!=null&&!used.has(i)){ MATCH[c.id]={p:LOCAL[i].p,k:'id'}; used.add(i); }
  }
  const byFolder={};
  LOCAL.forEach((f,i)=>{ if(used.has(i)||f.id) return; const k=norm(f.w); (byFolder[k]=byFolder[k]||[]).push(i); });
  for(const w of workspaces){
    const pool=byFolder[norm(w.name)]; if(!pool) continue;
    const cg={}, fg={};
    (clipsByWs[w.id]||[]).forEach(c=>{ if(MATCH[c.id]) return; const k=norm(c.title); if(k) (cg[k]=cg[k]||[]).push(c); });
    pool.forEach(i=>{ const f=LOCAL[i]; const k=[norm(f.t),norm(f.ft)].find(k=>k&&cg[k]); if(k) (fg[k]=fg[k]||[]).push(i); });
    for(const k in fg){
      const C=cg[k].slice().sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
      const Fi=fg[k].slice().sort((a,b)=>((trackNo(LOCAL[a].p)??1e9)-(trackNo(LOCAL[b].p)??1e9))||collator.compare(LOCAL[a].p,LOCAL[b].p));
      for(let j=0;j<Math.min(C.length,Fi.length);j++){ MATCH[C[j].id]={p:LOCAL[Fi[j]].p,k:'title'}; used.add(Fi[j]); }
    }
  }
  const wsByNorm={}; workspaces.forEach(w=>wsByNorm[norm(w.name)]=w.id);
  LOCAL.forEach((f,i)=>{ if(used.has(i)) return; const id=wsByNorm[norm(f.w)]||ORPH_ID; (LOCAL_ONLY[id]=LOCAL_ONLY[id]||[]).push(f); });
}
function logMatch(){
  let byId=0,byTitle=0; for(const k in MATCH) (MATCH[k].k==='id'?byId++:byTitle++);
  let lo=0; for(const k in LOCAL_ONLY) lo+=LOCAL_ONLY[k].length;
  logUI(`match: ${LOCAL.length} files on disk, ${nClips()} Suno tracks -> ${byId} by id, ${byTitle} by title, ${nClips()-byId-byTitle} missing, ${lo} only on disk (${(LOCAL_ONLY[ORPH_ID]||[]).length} in folders unknown to Suno)`);
}

/* ---- stats / status ---- */
function wsStats(w){
  const cs=clipsByWs[w.id]; if(!cs) return null;
  let have=0,first='',last='';
  cs.forEach(c=>{ if(MATCH[c.id]) have++; const d=c.created_at||''; if(d&&(!first||d<first)) first=d; if(d>last) last=d; });
  return {total:cs.length,have,miss:cs.length-have,first,last,local:(LOCAL_ONLY[w.id]||[]).length};
}
function renderStats(){
  const t=T(); if(!$('#nTracks')) return; let tot=0,have=0,known=0,lo=0;
  workspaces.forEach(w=>{ const s=wsStats(w); if(s){ tot+=s.total; have+=s.have; known++; } });
  for(const k in LOCAL_ONLY) lo+=LOCAL_ONLY[k].length;
  $('#nTracks').textContent=known?tot:'–'; $('#nWs').textContent=workspaces.length||'–';
  $('#nHave').textContent=known?have:'–'; $('#nMiss').textContent=known?(tot-have):'–'; $('#nLocal').textContent=LOCAL.length?lo:'–';
  const b=$('#btnEverything'), ready=known>0&&!syncing; b.textContent=ready?t.everything(tot-have):t.notAnalyzed;
  b.disabled=!ready||(tot-have)===0||!!(job&&job.running);
  $('#btnRecheck').disabled=syncing||!!scanProg;
}
function renderSync(){
  const t=T(); if(!$('#syncSuno')) return;
  let s1, s2;
  if(syncProg) s1=syncProg.n?t.syncing(syncProg.i,syncProg.n):t.syncList;
  else if(syncErr) s1=t.syncErr(syncErr);
  else s1=syncedAt?t.syncedAt(ago(syncedAt)):'';
  if(scanProg) s2=t.scanning(scanProg.done,scanProg.total);
  else if(scanErr) s2=t.scanErr(scanErr);
  else s2=scannedAt?t.scannedAt(LOCAL.length,ago(scannedAt)):'';
  $('#syncSuno').textContent=s1; $('#syncDisk').textContent=s2;
  const p=syncProg&&syncProg.n?syncProg.i/syncProg.n:(scanProg&&scanProg.total?scanProg.done/scanProg.total:null);
  $('#syncBarBox').classList.toggle('hidden',!(syncProg||scanProg)); $('#syncBar').style.width=(p==null?15:100*p)+'%';
  renderStats();
}

/* ---- workspaces column ---- */
function renderWorkspaces(){
  const t=T(), el=$('#wsList'); if(!el) return;
  if(!workspaces.length){ el.innerHTML='<div class="empty">'+(syncing?'…':esc(syncErr||'…'))+'</div>'; return; }
  const q=norm(F.wsQ);
  let list=workspaces.map(w=>({w,s:wsStats(w)})).filter(x=>(!q||norm(x.w.name).includes(q))&&(!F.incomplete||!x.s||x.s.miss>0));
  if(F.wsSort==='recent') list.sort((a,b)=>((b.s&&b.s.last)||'').localeCompare((a.s&&a.s.last)||''));
  else if(F.wsSort==='miss') list.sort((a,b)=>((b.s&&b.s.miss)||0)-((a.s&&a.s.miss)||0)||collator.compare(a.w.name,b.w.name));
  else list.sort((a,b)=>collator.compare(a.w.name,b.w.name));
  let tot=0,have=0; workspaces.forEach(w=>{ const s=wsStats(w); if(s){ tot+=s.total; have+=s.have; } });
  const rows=[];
  rows.push(`<div class="ws-item all ${currentWs===ALL_ID?'active':''}" onclick="openWorkspace('${ALL_ID}')"><div class="ph">♫</div><div class="meta"><div class="name">${esc(t.allTracks)}</div><div class="sub">${esc(t.allSub(workspaces.length))}</div></div><span class="badge ${tot&&have===tot?'full':'part'}">${have}/${tot}</span></div>`);
  rows.push('<div class="ws-sep"></div>');
  list.forEach(({w,s})=>{
    const img=w.image_url?`<img loading="lazy" src="${esc(w.image_url)}">`:'<div class="ph"></div>';
    const range=s&&s.first?(fmtMonth(s.first)===fmtMonth(s.last)?fmtMonth(s.first):`${fmtMonth(s.first)} → ${fmtMonth(s.last)}`):'';
    const badge=s?`<span class="badge ${s.miss===0?'full':'part'}" title="${esc(t.badgeTip)}">${s.have}/${s.total}</span>`:`<span class="badge">${w.clip_count||0}</span>`;
    const loc=s&&s.local?`<span class="badge loc" title="${esc(t.localOnlyTip)}">+${s.local}</span>`:'';
    rows.push(`<div class="ws-item ${currentWs===w.id?'active':''}" onclick="openWorkspace('${w.id}')">${img}<div class="meta"><div class="name">${esc(w.name||'—')}</div><div class="sub">${esc(range)}</div></div>${loc}${badge}</div>`);
  });
  const orph=LOCAL_ONLY[ORPH_ID]||[];
  if(orph.length){ rows.push('<div class="ws-sep"></div>'); rows.push(`<div class="ws-item orph ${currentWs===ORPH_ID?'active':''}" onclick="openWorkspace('${ORPH_ID}')"><div class="ph">📁</div><div class="meta"><div class="name">${esc(t.orphans)}</div><div class="sub">${esc(t.orphansSub)}</div></div><span class="badge loc">${orph.length}</span></div>`); }
  if(!list.length) rows.push('<div class="empty">'+esc(t.noWs)+'</div>');
  el.innerHTML=rows.join('');
}
async function openWorkspace(id){
  currentWs=id; selected=new Set(); F.limit=300; $('#search').value='';
  const w=wsById(id);
  logUI(`user: open ${id===ALL_ID?'All tracks':id===ORPH_ID?'folders unknown to Suno':'workspace "'+(w&&w.name)+'"'} (${w&&clipsByWs[id]?clipsByWs[id].length+' tracks in cache':'not loaded yet'})`);
  renderWorkspaces(); renderClips();
  if(w && !clipsByWs[id]){
    try{ clipsByWs[id]=await fetchClips(w); wsMarker[id]=w.marker; recomputeMatch(); saveCache(); }
    catch(e){ logUI(`workspace "${w.name}" failed: ${e.message||e}`); if(currentWs===id) $('#clipList').innerHTML='<div class="empty">'+esc(''+e)+'</div>'; return; }
    renderAll();
  }
  $('.col:nth-child(2)') && ($('.col:nth-child(2)').scrollTop=0);
}

/* ---- tracks column ---- */
function viewClips(){
  if(currentWs===ALL_ID){ const a=[]; workspaces.forEach(w=>a.push(...(clipsByWs[w.id]||[]))); return a; }
  return clipsByWs[currentWs]||null;
}
function originalsOf(cs){ const o=new Set(); cs.forEach(c=>{ if(c.cover) o.add(c.cover); }); return o; }
function filtered(cs){
  const q=norm($('#search').value);
  return cs.filter(c=>{
    if(F.filter==='have'&&!MATCH[c.id]) return false;
    if(F.filter==='miss'&&MATCH[c.id]) return false;
    if(F.filter==='fav'&&!c.is_liked) return false;
    return !q||norm(c.title).includes(q)||norm(c.tags).includes(q);
  });
}
function renderClips(){
  const t=T(), el=$('#clipList'); if(!el) return;
  const bm=$('#btnWsMissing'), bs=$('#btnSelected');
  $('#search').placeholder=t.search;
  $('#sortSel').innerHTML=[['new',t.sortNew],['old',t.sortOld],['az',t.sortAZ],['long',t.sortLong]].map(([k,n])=>`<option value="${k}" ${F.sort===k?'selected':''}>${esc(n)}</option>`).join('');
  const head=$('#wsHead');
  if(currentWs===ORPH_ID){
    bm.classList.add('hidden'); bs.classList.add('hidden'); $('#filterSeg').innerHTML='';
    head.innerHTML=`<div class="wshead"><div class="ph" style="display:grid;place-items:center;color:#fff">📁</div><div><h2>${esc(t.orphans)}</h2><div class="muted small-t">${esc(t.orphansHint)}</div></div></div>`;
    el.innerHTML=localFilesHtml(LOCAL_ONLY[ORPH_ID]||[],true); return;
  }
  const cs=viewClips();
  const w=wsById(currentWs);
  if(!cs){ head.innerHTML=''; el.innerHTML='<div class="empty">'+(currentWs&&w?'…':esc(t.pickWs))+'</div>'; bm.classList.add('hidden'); bs.classList.add('hidden'); $('#filterSeg').innerHTML=''; return; }
  // header
  let first='',last='',dur=0; cs.forEach(c=>{ const d=c.created_at||''; if(d&&(!first||d<first)) first=d; if(d>last) last=d; dur+=+c.duration||0; });
  const nHave=cs.filter(c=>MATCH[c.id]).length, nFav=cs.filter(c=>c.is_liked).length;
  const img=w&&w.image_url?`<img src="${esc(w.image_url)}">`:'<div class="ph"></div>';
  const range=first?`${fmtDate(first)} → ${fmtDate(last)}`:'';
  head.innerHTML=`<div class="wshead">${img}<div><h2>${esc(w?w.name:t.allTracks)}</h2><div class="muted small-t">${esc([t.nTracks(cs.length),range,dur?t.totalDur(Math.round(dur/3600*10)/10):''].filter(Boolean).join(' · '))}</div></div></div>`;
  $('#filterSeg').innerHTML=[['all',t.fAll,cs.length],['have',t.fHave,nHave],['miss',t.fMiss,cs.length-nHave],['fav',t.fFav,nFav]]
    .map(([k,n,c])=>`<button class="${F.filter===k?'on':''}" onclick="F.filter='${k}';F.limit=300;savePrefs();renderClips()">${esc(n)} <span class="muted">${c}</span></button>`).join('');
  const miss=cs.filter(c=>!MATCH[c.id]).length;
  bm.classList.remove('hidden'); bm.textContent=t.wsMissing(miss); bm.disabled=!miss||!!(job&&job.running);
  bs.classList.toggle('hidden',!selected.size); bs.textContent=t.selected(selected.size); bs.disabled=!!(job&&job.running);

    az:(a,b)=>collator.compare(a.title||'',b.title||''),long:(a,b)=>(+b.duration||0)-(+a.duration||0)}[F.sort]||((a,b)=>0);
  list.sort(by);
  const rows=[];
  if(!list.length) rows.push('<div class="empty">'+esc(F.filter==='miss'&&cs.length?t.nothingMissing:t.noTracks)+'</div>');
  list.slice(0,F.limit).forEach(c=>{
    const m=MATCH[c.id], o=orig.has(c.id);
    const av=m?(m.k==='id'?'✅':'☑️'):'🫥', avT=m?(m.k==='id'?t.matchedId:t.matchedTitle)+'\n'+m.p:t.notOnDisk;
    const im=c.image_url?`<img loading="lazy" src="${esc(c.image_url)}">`:'<div class="ph"></div>';
    const wsn=currentWs===ALL_ID&&CLIPWS[c.id]?`<span class="ws">${esc(CLIPWS[c.id].name)}</span> · `:'';
    const sub=[fmtDate(c.created_at,true),fmtDur(c.duration),c.tags].filter(Boolean).join(' · ');
    rows.push(`<div class="clip${o?' orig':''}"><input type="checkbox" ${selected.has(c.id)?'checked':''} ${m?'disabled':''} onchange="toggleSel('${c.id}',this.checked)">`+
      `<span class="avail" title="${esc(avT)}">${av}</span>${im}`+
      `<div class="t"><div class="title">${o?'<span class="star" title="'+esc(t.original)+'">★ </span>':''}${c.is_liked?'<span class="heart">♥ </span>':''}${esc(c.title||'—')}</div><div class="sub2">${wsn}${esc(sub)}</div></div>`+
      `<button class="small" onclick="play('${c.id}')">▶</button></div>`);
  });
  if(list.length>F.limit) rows.push(`<div class="more"><button class="small" onclick="F.limit+=300;renderClips()">${esc(t.showMore(list.length-F.limit))}</button></div>`);
  if(currentWs!==ALL_ID){ const lo=LOCAL_ONLY[currentWs]||[]; if(lo.length) rows.push(`<details class="localonly"><summary>${esc(t.localOnlyTitle(lo.length))}</summary><div class="muted small-t" style="margin:6px 0">${esc(t.localOnlyHint)}</div>${localFilesHtml(lo,false)}</details>`); }
  el.innerHTML=rows.join('');
}
function localFilesHtml(files,withDir){
  LOCAL_VIEW=files.slice().sort((a,b)=>collator.compare(a.p,b.p));
  if(!LOCAL_VIEW.length) return '<div class="empty">—</div>';
  return LOCAL_VIEW.map((f,i)=>{ const name=f.p.split(/[\\/]/).pop(); return `<div class="lfile"><button class="small" onclick="playLocal(${i})">▶</button><div class="fn" title="${esc(f.p)}">${esc(name)}${withDir?`<div class="dir">${esc(f.w)}</div>`:''}</div></div>`; }).join('');
}
function toggleSel(id,on){ on?selected.add(id):selected.delete(id); renderClips(); }

/* ============================== download job ============================== */
function trackNumbers(cs){ const r={}; cs.slice().sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||'')).forEach((c,i)=>r[c.id]=i+1); return r; }
function makeItems(cs){ const nums={}; return cs.map(c=>{ const w=CLIPWS[c.id]||{id:'',name:'Misc'}; if(!nums[w.id]) nums[w.id]=trackNumbers(clipsByWs[w.id]||[]); return {clip:c,ws:w.name||'Misc',track:nums[w.id][c.id]||1}; }); }
function confirmStart(n){ const t=T(); let m=t.confirmAll(n); if(ACC&&ACC.ok&&!ACC.pro) m+=t.confirmFree; return confirm(m); }
function downloadEverything(){
  const cs=[]; workspaces.forEach(w=>cs.push(...(clipsByWs[w.id]||[]).filter(c=>!MATCH[c.id])));
  if(!cs.length){ toast(T().nothingMissing); return; }
  if(confirmStart(cs.length)) runJob(makeItems(cs),'everything missing');
}
function downloadViewMissing(){
  const cs=(viewClips()||[]).filter(c=>!MATCH[c.id]);
  if(!cs.length){ toast(T().nothingMissing); return; }
  if(confirmStart(cs.length)) runJob(makeItems(cs),'missing in '+(currentWs===ALL_ID?'All tracks':((wsById(currentWs)||{}).name)));
}
function downloadSelected(){
  const cs=(viewClips()||[]).filter(c=>selected.has(c.id)&&!MATCH[c.id]); selected=new Set();
  if(cs.length) runJob(makeItems(cs),'selection');
}
async function runJob(items,what){
  job={items,i:0,ok:0,bad:0,skip:0,fails:[],running:true,stop:false}; renderAll();
  logUI(`download job start: ${items.length} tracks (${what})`);
  for(job.i=0; job.i<items.length; job.i++){
    if(job.stop) break;
    const it=items[job.i], c=it.clip; renderJob();
    if(MATCH[c.id]){ job.skip++; continue; }
    const body={clipId:c.id,audioUrl:c.audio_url,title:c.title,artist:c.display_name||'Suno',workspace:it.ws,disc:1,track:it.track,
      tags:c.tags||'',imageUrl:c.image_large_url||c.image_url||'',lyrics:c.prompt||'',createdAt:c.created_at||''};
    let r; try{ r=await post('/api/download',body); }catch(e){ r={ok:false,error:''+e}; }
    if(r.ok){ job.ok++; MATCH[c.id]={p:r.path,k:'id'}; LOCAL.push({p:r.path,id:c.id,id8:c.id.slice(0,8),t:c.title,ft:c.title,w:it.ws}); }
    else { job.bad++; job.fails.push({title:c.title||c.id,ws:it.ws,error:errText(r)});
      if(r.code==='not_authorized'&&job.bad>=3&&job.ok===0){ job.stop=true; job.fails.push({title:'—',ws:'',error:T().stopRefused}); } }
    if(job.i%3===0){ renderStats(); renderWorkspaces(); renderClips(); }
  }
  job.running=false; renderAll();
  logUI(`download job end: ${job.ok} ok, ${job.bad} failed, ${job.skip} already there${job.stop?' (stopped)':''}`);
  toast(T().jobDone(job.ok,job.bad),6000);
}
function stopJob(){ if(job&&job.running){ job.stop=true; $('#jobNow').textContent=T().stopping; } }
function renderJob(){
  const t=T(); if(!$('#jobBox')) return;
  const active=!!job;
  $('#jobIdle').classList.toggle('hidden',active); $('#jobBox').classList.toggle('hidden',!active);
  if(!active){ $('#failList').innerHTML=''; return; }
  const n=job.items.length, i=Math.min(job.i+1,n), cur=job.items[Math.min(job.i,n-1)];
  $('#jobStep').textContent=t.jobStep(job.running?i:n,n);
  if(!job.stop) $('#jobNow').textContent=job.running&&cur?`${cur.ws} — ${cur.clip.title||''}`:t.jobDone(job.ok,job.bad);
  $('#jobBar').style.width=(100*(job.running?job.i:n)/Math.max(1,n))+'%';
  $('#cOk').textContent=t.cOk(job.ok); $('#cBad').textContent=job.bad?t.cBad(job.bad):''; $('#cSkip').textContent=job.skip?t.cSkip(job.skip):'';
  $('#btnStop').classList.toggle('hidden',!job.running);
  $('#failList').innerHTML=job.fails.slice(-30).reverse().map(f=>`<div class="fail"><b>${esc(f.ws)} — ${esc(f.title)}</b>${esc(f.error)}</div>`).join('');
}

/* ============================== player ============================== */
function findClip(id){ for(const k in clipsByWs){ const c=(clipsByWs[k]||[]).find(x=>x.id===id); if(c) return c; } return null; }
function play(id){
  const t=T(), c=findClip(id); if(!c) return; player.clip=c; const a=$('#audio'), m=MATCH[id];
  a.src=m?('/api/play?path='+encodeURIComponent(m.p)):(c.audio_url||'');
  $('#pName').textContent=c.title||'—';
  $('#pSub').textContent=[m?t.localFile:(c.audio_url?t.sunoStream:t.noSource),(CLIPWS[id]||{}).name,fmtDate(c.created_at,true)].filter(Boolean).join(' · ');
  $('#player').classList.add('show'); alignedWords=null; a.play().catch(()=>{});
}
function playLocal(i){
  const t=T(), f=LOCAL_VIEW[i]; if(!f) return; player.clip=null; const a=$('#audio');
  a.src='/api/play?path='+encodeURIComponent(f.p);
  $('#pName').textContent=f.p.split(/[\\/]/).pop(); $('#pSub').textContent=t.localFile+' · '+f.w;
  $('#player').classList.add('show'); alignedWords=null; a.play().catch(()=>{});
}
async function openKaraoke(){
  const c=player.clip; if(!c){ toast(T().noLyrics); return; } $('#karaoke').classList.add('show'); $('#karaokeLine').textContent='…';
  try{ const d=await api('/api/lyrics?id='+c.id); const w=d.aligned_words||[];
    if(w.length){ alignedWords=w.map(x=>({t:esc(x.word||''),s:x.start_s||0,e:x.end_s||0})); $('#karaokeLine').innerHTML=alignedWords.map((x,i)=>`<span class="w" id="kw${i}">${x.t}</span>`).join(' '); }
    else $('#karaokeLine').innerHTML=esc(c.prompt||'—').replace(/\n/g,'<br>');
  }catch(e){ $('#karaokeLine').textContent='—'; }
}
function closeKaraoke(){ $('#karaoke').classList.remove('show'); }
$('#audio').addEventListener('timeupdate',()=>{ if(!alignedWords) return; const t=$('#audio').currentTime;
  alignedWords.forEach((w,i)=>{ const s=document.getElementById('kw'+i); if(s) s.classList.toggle('on',t>=w.s&&t<=w.e); }); });
/* ============================== boot ============================== */
(async function(){
  applyLang();
  CFG=await api('/api/config');
  if(CFG.language && CFG.language!==LANG){ LANG=CFG.language; try{localStorage.setItem('sunodlaa_lang',LANG);}catch(e){} }
  AUTH=await api('/api/auth').catch(()=>({ok:false}));
  if(AUTH.ok) loadAccount();
  applyLang();
  if(AUTH.ok && CFG.libraryExists) openLibrary(); else showSetup();
})();

</script>
